# Installation automatique du serveur E-KO RIP Center sur Debian 13.
# Seuls le mot de passe du compte « eko » et la confirmation d'écriture du disque
# sont demandés : aucun secret n'est rangé dans l'image.

d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i time/zone string Europe/Paris
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string eko-rip
d-i netcfg/get_domain string local
d-i netcfg/hostname string eko-rip

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/disable-cdrom-entries boolean true

# Compte d'administration « eko » (sudo) ; pas de compte root.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Administrateur E-KO RIP
d-i passwd/username string eko

# Disque entier. La question « Écrire les modifications sur les disques ? » reste
# posée : c'est le dernier garde-fou avant l'effacement.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Le serveur, puis l'adresse de l'écran affichée à la connexion de la console.
# La source « deb cdrom: » n'est retirée qu'après ce script : laissée, apt attend
# l'insertion du disque sans rien afficher. Le < /dev/null fait échouer toute question
# au lieu de bloquer, et les && arrêtent l'installation sur un échec visible.
d-i preseed/late_command string \
    sed -i 's/^deb cdrom:/# deb cdrom:/' /target/etc/apt/sources.list && \
    cp /cdrom/eko/eko-rip-serveur.deb /target/tmp/eko-rip-serveur.deb && \
    in-target apt-get update && \
    in-target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/eko-rip-serveur.deb < /dev/null' && \
    in-target rm -f /tmp/eko-rip-serveur.deb && \
    printf 'E-KO RIP Center : http://\\4:8640\n\n' > /target/etc/issue.d/eko-rip.issue

d-i finish-install/reboot_in_progress note
