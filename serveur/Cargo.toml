[package]
name = "eko-rip-serveur"
version.workspace = true
license.workspace = true
publish.workspace = true
edition = "2024"
description = "Serveur du RIP E-KO RIP Center"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["tiff", "png"] }
tiff = "0.11.3"
# Lecture des PNG reçus ligne par ligne (déjà tirée par `image`).
png = "0.18.1"
weezl = "0.1.12"
lopdf = "0.46.0"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
# Épreuve TIFF envoyée en flux (déjà tirée par axum).
tokio-util = { version = "0.7.20", features = ["io"] }
usvg = { version = "0.48.1", default-features = false }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
hmac = "0.13.0"
sha2 = "0.11.1"
qrcodegen = "1.8.0"
# Client HTTPS du pont ERP (lot R2) : synchrone, léger, rustls (ring + racines webpki), sans gzip.
ureq = { version = "~3.4.2", default-features = false, features = ["rustls", "json"] }
# Cloud E-KO RIP : côté serveur du tunnel vers la plate-forme.
eko-rip-cloud = { path = "../cloud" }
mdns-sd = "0.21.6"

[package.metadata.deb]
name = "eko-rip-serveur"
maintainer = "2M Numérique <mathieu.vignaud2@gmail.com>"
copyright = "2026, 2M Numérique"
extended-description = "Serveur du RIP E-KO RIP Center : reçoit les PDF des postes par le navigateur, les rend en plaques d'encre et pilote les machines branchées. Se rattache au Cloud E-KO RIP (https://platform.e-ko.rip) pour l'accès à distance sans VPN."
depends = "$auto, ghostscript, adduser"
section = "graphics"
priority = "optional"
maintainer-scripts = "debian/"
systemd-units = { unit-name = "eko-rip-serveur", enable = true, start = true }
assets = [
    ["target/release/eko-rip-serveur", "usr/bin/", "755"],
    ["debian/eko-rip-serveur.default", "etc/default/eko-rip-serveur", "644"],
    ["debian/60-eko-rip-kona.rules", "usr/lib/udev/rules.d/60-eko-rip-kona.rules", "644"],
]
conf-files = ["/etc/default/eko-rip-serveur"]

# Fuseau horaire local (sauvegarde de nuit du cloud).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
tower = { version = "0.5.3", features = ["util"] }
