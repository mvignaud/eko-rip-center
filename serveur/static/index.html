<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-KO RIP Center</title>
<style>
  :root {
    --fond: #f3f5f8; --carte: #fff; --creux: #f7f8fa; --texte: #18202a; --doux: #5f6b78; --trait: #dfe3e8;
    --accent: #0b6bcb; --accent-doux: #e6f0fb; --ok: #1a7f37; --ok-doux: #e5f4ea; --echec: #b42318; --echec-doux: #fdecea;
    --alerte: #9a5b00; --alerte-doux: #fff4e0;
    --attente: #6b7280; --attente-doux: #eef0f3; --ombre: 0 1px 2px rgb(16 24 40 / .06), 0 1px 3px rgb(16 24 40 / .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #0f1318; --carte: #171c23; --creux: #12161c; --texte: #e8ebee; --doux: #9aa4ae; --trait: #2a323c;
      --accent: #5aa7f0; --accent-doux: #13263a; --ok: #4ac26b; --ok-doux: #11281a; --echec: #f97066; --echec-doux: #2d1513;
      --attente: #9aa4ae; --attente-doux: #222a33; --ombre: none;
      --alerte: #f5b64f; --alerte-doux: #2e2210;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--fond); color: var(--texte); }
  input, select, button { font: inherit; color: inherit; }
  input:not([type=checkbox]), select { background: var(--carte); border: 1px solid var(--trait); border-radius: 6px; padding: 6px 8px; min-width: 0; }
  input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 500; }
  button.discret { background: transparent; color: var(--accent); border: 1px solid var(--trait); padding: 4px 10px; font-weight: 400; }
  button.discret:hover { background: var(--accent-doux); }
  button.danger { color: var(--echec); }
  button:disabled { opacity: .5; cursor: default; }
  .erreur { color: var(--echec); }
  .meta { color: var(--doux); font-size: 13px; }
  [hidden] { display: none !important; }

  /* Barre du haut */
  .barre { position: sticky; top: 0; z-index: 5; background: var(--carte); border-bottom: 1px solid var(--trait); }
  .barre-int { max-width: 1280px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; min-height: 56px; }
  .logo { font-weight: 700; font-size: 16px; letter-spacing: .2px; }
  .logo span { color: var(--accent); }
  nav { display: flex; gap: 4px; flex: 1; }
  nav button { background: none; color: var(--doux); border-radius: 6px; padding: 8px 12px; }
  nav button[aria-current=page] { background: var(--accent-doux); color: var(--accent); }
  nav .compte { margin-left: 6px; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 7px; font-size: 12px; }
  .outils { display: flex; align-items: center; gap: 8px; }
  .bandeau { max-width: 1280px; margin: 12px auto 0; padding: 10px 16px; background: var(--echec-doux); color: var(--echec); border-radius: 8px; }

  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  .vue-travaux { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .vue-travaux { grid-template-columns: 1fr; } }
  .panneau { background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; box-shadow: var(--ombre); }
  .panneau > h2, .panneau > header { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--trait); font-size: 14px; }
  .corps { padding: 16px; display: grid; gap: 12px; }
  aside.panneau { position: sticky; top: 72px; max-height: calc(100vh - 88px); overflow: auto; }
  @media (max-width: 900px) { aside.panneau { position: static; max-height: none; } }

  /* Formulaire */
  label { display: grid; gap: 4px; font-size: 12px; color: var(--doux); }
  label > select, label > input { color: var(--texte); font-size: 14px; }
  label.case { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texte); }
  label.lien { color: var(--accent); cursor: pointer; font-size: 13px; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  details.section { border: 1px solid var(--trait); border-radius: 8px; }
  details.section > summary { cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  details.section > summary::-webkit-details-marker { display: none; }
  details.section > summary::after { content: "▸"; color: var(--doux); }
  details.section[open] > summary::after { content: "▾"; }
  details.section > div { padding: 4px 12px 12px; display: grid; gap: 10px; }
  .depot { border: 2px dashed var(--trait); border-radius: 10px; padding: 18px 12px; text-align: center; color: var(--doux); cursor: pointer; background: var(--creux); }
  .depot strong { color: var(--texte); display: block; margin-bottom: 2px; font-size: 14px; }
  .depot:hover, body.glisse .depot { border-color: var(--accent); background: var(--accent-doux); }
  body.glisse::after { content: ""; position: fixed; inset: 0; border: 3px dashed var(--accent); pointer-events: none; z-index: 20; }
  .ligne { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ligne.bas { align-items: end; }
  .ligne > label { flex: 1; }
  #message { position: fixed; z-index: 30; left: 50%; bottom: 20px; transform: translateX(-50%); margin: 0; max-width: min(640px, calc(100vw - 32px));
    padding: 10px 16px; border-radius: 8px; background: var(--texte); color: var(--fond); box-shadow: 0 4px 16px rgb(0 0 0 / .25); font-size: 13px; }
  #message.erreur { background: var(--echec); color: #fff; }

  /* Liste des travaux */
  .filtres { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filtres input[type=search] { flex: 1; min-width: 180px; }
  .puce { background: var(--carte); color: var(--doux); border: 1px solid var(--trait); border-radius: 999px; padding: 4px 12px; font-weight: 400; }
  .puce[aria-pressed=true] { background: var(--accent-doux); color: var(--accent); border-color: var(--accent); }
  .travail { margin-bottom: 10px; overflow: hidden; }
  .travail > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; }
  .travail > summary::-webkit-details-marker { display: none; }
  @media (max-width: 560px) { .travail > summary { grid-template-columns: 56px 1fr; } .travail > summary > .ligne { grid-column: 1 / -1; } }
  .vignette { width: 100%; aspect-ratio: 4 / 3; border-radius: 6px; border: 1px solid var(--trait); background: #fff center/contain no-repeat; }
  .vignette.vide { background: var(--creux); }
  .nom { font-weight: 600; overflow-wrap: anywhere; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; align-items: center; }
  .badge { font-size: 12px; border-radius: 999px; padding: 1px 8px; background: var(--attente-doux); color: var(--attente); white-space: nowrap; }
  .badge.termine, .badge.terminee { background: var(--ok-doux); color: var(--ok); }
  .badge.echec { background: var(--echec-doux); color: var(--echec); }
  .badge.alerte { background: var(--alerte-doux); color: var(--alerte); }
  ul.alertes { margin: 0; padding: 8px 12px 8px 28px; background: var(--alerte-doux); color: var(--alerte); border-radius: 8px; font-size: 13px; }
  .badge.en_cours { background: var(--accent-doux); color: var(--accent); }
  .badge.en_cours::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 5px; animation: pouls 1s infinite alternate; }
  @keyframes pouls { from { opacity: .3; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .badge.en_cours::before { animation: none; } }
  .detail { border-top: 1px solid var(--trait); padding: 12px; display: grid; gap: 12px; background: var(--creux); }
  .page { background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
  .page-tete { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .plaques { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  figure { margin: 0; }
  figure img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #fff; border: 1px solid var(--trait); border-radius: 6px; }
  figcaption { font-size: 12px; text-align: center; color: var(--doux); overflow-wrap: anywhere; }
  .vide-liste { text-align: center; color: var(--doux); padding: 32px 16px; margin: 0; }
  #planche { margin-bottom: 12px; }
  #planche .corps { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); align-items: end; }

  /* File d'attente */
  .vue-file { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 16px; align-items: start; }
  .sortie { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 10px 16px; border-top: 1px solid var(--trait); }
  .sortie:first-child { border-top: 0; }
  @media (max-width: 560px) { .sortie { grid-template-columns: 1fr; } }
  .sortie .actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; align-items: start; }
  .sortie .actions button { padding: 2px 8px; }
  .systeme dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; }
  .systeme dt { color: var(--doux); }
  .systeme dd { margin: 0; }
  .vue-systeme { display: grid; gap: 16px; }
  .tarifs { display: grid; grid-template-columns: minmax(120px, max-content) repeat(2, minmax(90px, 140px)); gap: 6px 12px; align-items: center; }
  .tarifs input { width: 100%; }
  .tarifs .tete { font-size: 12px; color: var(--doux); }
  .jauge { height: 8px; border-radius: 4px; background: var(--attente-doux); overflow: hidden; margin-top: 4px; max-width: 320px; }
  .jauge > div { height: 100%; background: var(--accent); }
  .jauge.basse > div { background: var(--echec); }

  dialog { border: 1px solid var(--trait); border-radius: 10px; background: var(--carte); color: var(--texte); padding: 0; box-shadow: var(--ombre); }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog form { display: grid; gap: 12px; padding: 20px; min-width: min(340px, 84vw); }
</style>
</head>
<body>
<header class="barre"><div class="barre-int">
  <div class="logo">E-KO <span>RIP</span> Center</div>
  <nav aria-label="Navigation">
    <button type="button" data-vue="travaux" data-t="nav_travaux"></button>
    <button type="button" data-vue="file"><span data-t="nav_file"></span><span id="compte-file" class="compte" hidden></span></button>
    <button type="button" data-vue="systeme" data-t="nav_systeme"></button>
  </nav>
  <div class="outils">
    <span id="qui" class="meta"></span>
    <button type="button" id="deconnexion" class="discret" data-t="deconnexion" hidden></button>
    <button type="button" id="langue" class="discret"></button>
  </div>
</div></header>
<p id="acces-libre" class="bandeau" data-t="acces_libre" hidden></p>
<dialog id="fenetre-edition">
  <form id="form-edition">
    <strong id="titre-edition"></strong>
    <div id="edition-travail" style="display: grid; gap: 10px"></div>
    <p id="erreur-edition" class="erreur" role="alert"></p>
    <div class="ligne"><button data-t="appliquer"></button><button type="button" class="discret" id="fermer-edition" data-t="fermer"></button></div>
  </form>
</dialog>
<dialog id="visionneuse">
  <form method="dialog" style="padding: 12px; display: grid; gap: 8px; max-width: 92vw">
    <img id="image-vue" alt="" style="max-width: 88vw; max-height: 78vh; background: #fff; border: 1px solid var(--trait); border-radius: 6px">
    <div class="ligne" style="justify-content: space-between"><span id="legende-vue" class="meta"></span><button class="discret" data-t="fermer"></button></div>
  </form>
</dialog>
<dialog id="connexion">
  <form id="form-connexion">
    <strong data-t="connexion"></strong>
    <label><span data-t="nom_utilisateur"></span> <input name="nom" autocomplete="username" required></label>
    <label><span data-t="mot_de_passe"></span> <input name="mot_de_passe" type="password" autocomplete="current-password" required></label>
    <p id="erreur-connexion" class="erreur" role="alert"></p>
    <button data-t="se_connecter"></button>
  </form>
</dialog>

<main>
  <section id="vue-travaux" class="vue-travaux">
    <aside class="panneau">
      <h2 data-t="nouveau_travail"></h2>
      <form id="envoi" class="corps">
        <label class="depot">
          <strong data-t="deposer_ici"></strong><span data-t="fichier"></span>
          <input type="file" name="fichier" accept="application/pdf,.pdf,.ai,image/svg+xml,.svg" multiple hidden>
          <span id="nom-fichier" class="meta"></span>
        </label>
        <div class="ligne bas">
          <label><span data-t="reglage"></span> <select id="reglage"></select></label>
          <button type="button" class="discret" id="enregistrer-reglage" data-t="enregistrer_reglage"></button>
          <button type="button" class="discret danger" id="supprimer-reglage" data-t="supprimer_reglage"></button>
        </div>
        <div class="deux">
          <label><span data-t="mode"></span>
            <select name="mode"><option value="imprimer" data-t="imprimer"></option><option value="decouper" data-t="decouper"></option></select>
          </label>
          <label><span data-t="resolution"></span>
            <select name="dpi"><option>360</option><option selected>720</option><option>1440</option></select>
          </label>
        </div>
        <label><span data-t="traces"></span>
          <select name="traces"><option value="tons" data-t="tons"></option><option value="tous" data-t="tous"></option></select>
        </label>
        <label><span data-t="reperage"></span>
          <select name="reperage"><option value="aucun" data-t="aucun"></option><option value="manuel" data-t="manuel"></option><option value="cadre" data-t="cadre"></option></select>
        </label>
        <details class="section" id="couleur"><summary data-t="couleur"></summary><div>
          <label><span data-t="profil_cmjn"></span><select name="profil_cmjn" data-espace="CMYK"></select></label>
          <label><span data-t="profil_rvb"></span><select name="profil_rvb" data-espace="RGB"></select></label>
          <label><span data-t="profil_sortie"></span><select name="profil_sortie" data-espace="CMYK"></select></label>
          <label><span data-t="intention"></span><select name="intention"></select></label>
          <label class="case"><input type="checkbox" name="forcer_profils" value="oui"> <span data-t="forcer"></span></label>
          <label class="lien"><span data-t="deposer"></span><input type="file" id="profil" accept=".icc,.icm" hidden></label>
        </div></details>
        <details class="section"><summary data-t="edition"></summary><div id="edition-envoi"></div></details>
        <details class="section"><summary data-t="auto"></summary><div>
          <label class="case"><input type="checkbox" name="auto_imprimer" value="oui"> <span data-t="auto_imprimer"></span></label>
          <label class="case"><input type="checkbox" name="auto_decouper" value="oui"> <span data-t="auto_decouper"></span></label>
          <label class="case"><input type="checkbox" name="auto_suspendre" value="oui"> <span data-t="auto_suspendre"></span></label>
          <p class="meta" style="margin: 0" data-t="note_auto"></p>
        </div></details>
        <details class="section"><summary data-t="blanc"></summary><div>
          <label><span data-t="blanc_mode"></span>
            <select name="blanc"><option value="aucun" data-t="blanc_aucun"></option><option value="sous_couche" data-t="blanc_sous_couche"></option><option value="aplat" data-t="blanc_aplat"></option></select>
          </label>
          <div class="deux">
            <label><span data-t="retraction"></span> <input type="number" name="blanc_retraction_mm" value="0.2" min="0" max="5" step="0.05"></label>
            <label><span data-t="seuil"></span> <input type="number" name="blanc_seuil" value="5" min="1" max="100" step="1"></label>
          </div>
          <p class="meta" style="margin: 0" data-t="note_blanc"></p>
        </div></details>
        <details class="section"><summary data-t="mosaique"></summary><div>
          <label class="case"><input type="checkbox" name="mosaique" value="oui"> <span data-t="mosaique_activer"></span></label>
          <div class="deux">
            <label><span data-t="laize"></span> <input type="number" name="laize_mm" value="1600" min="50" max="5000" step="1"></label>
            <label><span data-t="recouvrement"></span> <input type="number" name="recouvrement_mm" value="20" min="0" max="200" step="1"></label>
          </div>
          <label class="case"><input type="checkbox" name="reperes_les" value="oui"> <span data-t="reperes_les"></span></label>
        </div></details>
        <button type="submit" data-t="envoyer"></button>
      </form>
    </aside>

    <div>
      <section id="planche" class="panneau" hidden>
        <header><strong data-t="planche"></strong></header>
        <div class="corps">
          <label><span data-t="laize"></span> <input type="number" id="laize" value="1600" min="50" max="5000" step="1"></label>
          <label><span data-t="espacement"></span> <input type="number" id="espacement" value="5" min="0" max="100" step="0.5"></label>
          <label class="case"><input type="checkbox" id="rotation"> <span data-t="rotation"></span></label>
          <button type="button" id="creer-planche"></button>
        </div>
      </section>
      <div class="filtres">
        <input type="search" id="recherche" data-t-placeholder="rechercher">
        <button type="button" class="puce" data-filtre="" aria-pressed="true" data-t="filtre_tous"></button>
        <button type="button" class="puce" data-filtre="actif" aria-pressed="false" data-t="filtre_actifs"></button>
        <button type="button" class="puce" data-filtre="termine" aria-pressed="false" data-t="termine"></button>
        <button type="button" class="puce" data-filtre="echec" aria-pressed="false" data-t="echec"></button>
      </div>
      <section id="travaux" aria-live="polite"></section>
    </div>
  </section>

  <section id="vue-file" class="vue-file" hidden></section>

  <section id="vue-systeme" class="vue-systeme" hidden>
    <section class="panneau systeme"><h2 data-t="nav_systeme"></h2><div class="corps" id="systeme"></div></section>
    <section class="panneau"><h2 data-t="couts"></h2><form class="corps" id="tarifs"></form></section>
  </section>
</main>
<p id="message" role="status" hidden></p>
<script>
const textes = {
  fr: {
    nav_travaux: "Travaux", nav_file: "File d'attente", nav_systeme: "Système", nouveau_travail: "Nouveau travail",
    deposer_ici: "Déposer un fichier ici", fichier: "PDF, AI ou SVG — ou cliquer pour choisir", resolution: "Résolution", mode: "Mode",
    imprimer: "Imprimer (et découper)", decouper: "Découper seulement",
    traces: "Tracés à découper", tons: "Tons de découpe (CutContour…)", tous: "Tous les tracés", apercu_decoupe: "Découpe",
    couleur: "Couleur", profil_cmjn: "Entrée CMJN", profil_rvb: "Entrée RVB", profil_sortie: "Support (sortie)", defaut: "Par défaut",
    intention: "Intention", intentions: ["Perceptuelle", "Colorimétrique relative", "Saturation", "Colorimétrique absolue"],
    forcer: "Ignorer les profils du PDF", deposer: "Ajouter un profil ICC…", depose: (n) => `Profil « ${n} » ajouté.`,
    version: "Version", disque: "Espace libre", conservation: "Conservation des travaux", jours: (j) => (j ? `${j} jours` : "illimitée"),
    libre_sur: (libre, total) => `${libre} sur ${total}`,
    connexion: "Connexion à E-KO RIP Center", nom_utilisateur: "Utilisateur", mot_de_passe: "Mot de passe", se_connecter: "Se connecter",
    deconnexion: "Se déconnecter", connecte: (n) => `Connecté : ${n}`,
    acces_libre: "Accès libre : aucun utilisateur n'est déclaré sur ce serveur. Créer un compte sur le serveur : eko-rip-serveur utilisateur ajouter <nom>",
    reglage: "Réglage", aucun_reglage: "— saisie libre —", enregistrer_reglage: "Enregistrer…", supprimer_reglage: "Supprimer",
    nom_reglage: "Nom du réglage (son dossier surveillé portera ce nom) :", reglage_enregistre: (n) => `Réglage « ${n} » enregistré ; dossier surveillé : entrees/${n}/`,
    edition: "Édition rapide", echelle: "Échelle (%)", rotation_ed: "Rotation", marge: "Marge blanche (mm)", miroir: "Miroir (vitrophanie)",
    oeillets: "Œillets (repères imprimés)", espacement_oe: "Écart maximal (mm)", retrait_oe: "Distance au bord (mm)", diametre_oe: "Diamètre (mm)",
    bords: ["Haut", "Bas", "Gauche", "Droite"], contour: "Contour de découpe rectangulaire", contour_mm: "Décalage du contour (mm, négatif = dedans)",
    auto: "Mise en file automatique", auto_imprimer: "Imprimer sur l'Epson une fois rendu", auto_decouper: "Découper sur le Kona",
    auto_suspendre: "Ajouter en suspendu (à libérer depuis la file)", note_auto: "Une découpe qui suit une impression est toujours ajoutée suspendue : le support doit d'abord passer au Kona.",
    editer: "Éditer", editer_titre: (n) => `Édition rapide — ${n}`, appliquer: "Appliquer et refaire le rendu", fermer: "Fermer",
    taille_mm: (l, h) => `≈ ${l} × ${h} mm`, fichiers_choisis: (n) => `${n} fichiers choisis`,

let langue = (() => { try { return localStorage.getItem("langue"); } catch { return null; } })()
  || (navigator.language.startsWith("fr") ? "fr" : "en");

function el(tag, attrs = {}, ...enfants) {
  const n = document.createElement(tag);
  Object.assign(n, attrs);
  n.append(...enfants.filter((e) => e !== null && e !== undefined && e !== false));
  return n;
}
function bouton(texte, action, classe = "discret") {
  const b = el("button", { type: "button", className: classe }, texte);
  b.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); action(b); });
  return b;
}
/** Message flottant, commun à toutes les vues ; une erreur reste plus longtemps. */
let minuterieMessage;
function dire(texte, erreur = false) {
  msg.className = erreur ? "erreur" : "";
  msg.textContent = texte;
  msg.hidden = !texte;
  clearTimeout(minuterieMessage);
  if (texte) minuterieMessage = setTimeout(() => { msg.hidden = true; }, erreur ? 10000 : 4000);
}

/** Texte traduit d'une erreur : le code est traduit, le détail technique est ajouté tel quel. */
function texteErreur(code, detail) {
  const base = T().erreurs[code] || T().erreurs.erreur_interne;
  return detail ? `${base} (${detail})` : base;
}

/** Appel à l'API ; une erreur est dite dans la zone de message. Rend la réponse JSON (ou {}), ou null. */
async function api(url, options = {}) {
  let r;
  try { r = await fetch(url, options); } catch { dire(texteErreur("reseau"), true); return null; }
  const c = await r.json().catch(() => ({}));
  if (r.status === 413) { dire(texteErreur("trop_gros"), true); return null; }
  if (!r.ok) { if (r.status !== 401) dire(texteErreur(c.code, c.detail), true); return null; }
  return c;
}
const json = (methode, corps) => ({ method: methode, headers: { "Content-Type": "application/json" }, body: JSON.stringify(corps) });

// Session : toute réponse 401 de l'API ouvre la fenêtre de connexion.
const fetchServeur = window.fetch.bind(window);
const fenetreConnexion = $("connexion"), formConnexion = $("form-connexion");
let session = { acces_libre: false, utilisateur: null };
window.fetch = async (url, options) => {
  const r = await fetchServeur(url, options);
  if (r.status === 401 && !String(url).startsWith("/api/session") && !fenetreConnexion.open) fenetreConnexion.showModal();
  return r;
};
async function chargerSession() {
  try { session = await (await fetchServeur("/api/session")).json(); } catch { return; }
  afficherSession();
}
function afficherSession() {
  $("acces-libre").hidden = !session.acces_libre;
  $("deconnexion").hidden = !session.utilisateur;
  $("qui").textContent = session.utilisateur ? T().connecte(session.utilisateur) : "";
}
formConnexion.addEventListener("submit", async (e) => {
  e.preventDefault();
  const champs = Object.fromEntries(new FormData(formConnexion)), erreur = $("erreur-connexion");
  try {
    const r = await fetchServeur("/api/session", json("POST", champs));
    if (!r.ok) { const c = await r.json().catch(() => ({})); erreur.textContent = texteErreur(c.code, c.detail); return; }
  } catch { erreur.textContent = texteErreur("reseau"); return; }
  erreur.textContent = "";
  formConnexion.reset();
  fenetreConnexion.close();
  await chargerSession();
  toutCharger();
});
$("deconnexion").addEventListener("click", async () => {

});

const vues = ["travaux", "file", "systeme"];
function montrer(vue) {
  if (!vues.includes(vue)) vue = "travaux";
  vues.forEach((v) => { $(`vue-${v}`).hidden = v !== vue; });
  document.querySelectorAll("nav [data-vue]").forEach((b) => b.setAttribute("aria-current", b.dataset.vue === vue ? "page" : "false"));
  if (location.hash.slice(1) !== vue) history.replaceState(null, "", `#${vue}`);
  rafraichir();
}

/** Listes de profils filtrées par espace ; le choix courant est gardé au changement de langue. */
function remplirProfils() {
  document.querySelectorAll("#couleur select[data-espace]").forEach((s) => {
    const garde = s.value;
    s.replaceChildren(el("option", { value: "" }, T().defaut),
      ...profils.filter((p) => p.espace === s.dataset.espace).map((p) => el("option", { value: p.fichier, title: p.description }, p.description || p.fichier)));
    s.value = garde;
  });
  const i = form.intention, garde = i.value || "0";
  i.replaceChildren(...T().intentions.map((n, k) => el("option", { value: String(k) }, n)));
  i.value = garde;
}
$("profil").addEventListener("change", async (e) => {

  const corps = new FormData(); corps.append("fichier", fichier);

function afficherTarifs() {
  const f = $("tarifs");
  if (!tarifs || f.contains(document.activeElement)) return;
  const vues = travaux.flatMap((t) => t.pages.flatMap((p) => p.plaques.filter((x) => !(p.plaques_decoupe || []).includes(x))));
  const noms = [...new Set(["Cyan", "Magenta", "Yellow", "Black", "White", "Silver", ...Object.keys(tarifs.encres), ...vues])];
  const champ = (name, valeur, defaut) => el("input", { type: "number", min: 0, step: "any", name, value: valeur ?? "", placeholder: defaut ?? "" });
  const d = tarifs.encre_defaut;
  const grille = el("div", { className: "tarifs" },
    el("span", { className: "tete" }, T().encre), el("span", { className: "tete" }, T().ml_m2), el("span", { className: "tete" }, T().prix_litre),
    el("strong", {}, T().autres_encres), champ("defaut_ml", d.ml_m2), champ("defaut_prix", d.prix_litre),
    ...noms.flatMap((n) => [el("span", {}, n), champ(`ml:${n}`, tarifs.encres[n]?.ml_m2, d.ml_m2), champ(`prix:${n}`, tarifs.encres[n]?.prix_litre, d.prix_litre)]));
  f.replaceChildren(el("p", { className: "meta", style: "margin: 0" }, T().note_tarifs), grille,
    el("label", { style: "max-width: 200px" }, T().support_m2, champ("support", tarifs.support_m2)),

      el("a", { href: "/api/rapports/consommation.csv", download: "consommation.csv" }, T().export_csv)));
}
$("tarifs").addEventListener("submit", async (e) => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData($("tarifs")));
  const nb = (x) => (x === "" || x === undefined ? null : +x);
  const defaut = { ml_m2: nb(v.defaut_ml) ?? 0, prix_litre: nb(v.defaut_prix) ?? 0 };
  const encres = {};
  for (const cle of Object.keys(v).filter((k) => k.startsWith("ml:"))) {
    const n = cle.slice(3), ml = nb(v[cle]), prix = nb(v[`prix:${n}`]);
    if (ml !== null || prix !== null) encres[n] = { ml_m2: ml ?? defaut.ml_m2, prix_litre: prix ?? defaut.prix_litre };
  }
  const r = await api("/api/tarifs", json("POST", { encre_defaut: defaut, encres, support_m2: nb(v.support) ?? 0 }));
  if (r) { tarifs = r; document.activeElement.blur(); afficherTarifs(); dire(T().tarifs_enregistres); derniereEmpreinte = ""; rafraichir(); }

/** Une page : ses sorties (Epson, Kona), puis ses aperçus (composite, découpe, plaques). */
function vuePage(t, page, n) {
  const base = `/api/travaux/${t.id}/pages/${n}`;
  const vignette = (src, legende) => {
    const img = el("img", { src, alt: legende, loading: "lazy", style: "cursor: zoom-in" });
    img.addEventListener("click", () => voir(src, legende, !src.endsWith(".svg")));
    return el("figure", {}, img, el("figcaption", {}, legende));
  };
  const vignettes = t.mode === "decouper" ? [] : [vignette(`${base}/apercu.png`, T().composite)];
  if (page.traces_decoupe) vignettes.push(vignette(`${base}/decoupe.svg`, T().apercu_decoupe));
  const taux = (p) => (page.couverture && p in page.couverture ? ` · ${nombre(page.couverture[p] * 100, 0)} %` : "");
  vignettes.push(...page.plaques.map((p) => vignette(`${base}/plaques/${encodeURIComponent(p)}`,
    (page.plaques_decoupe || []).includes(p) ? T().non_imprimee(p) : p + taux(p))));

  const sortiesPage = el("div", { className: "ligne" });
  const versMachine = (machine, texte) => {
    const s = derniereSortie(t, n, machine);
    sortiesPage.append(bouton(texte, async (b) => {
      b.disabled = true;
      if (await api("/api/file", json("POST", { travail: t.id, page: n, machine }))) dire(T().mis_en_file);
      rafraichir();
    }));
    if (s) sortiesPage.append(el("span", { className: `badge ${s.etat}` }, T().etats[s.etat]));
  };
  const imprimables = page.plaques.filter((p) => !(page.plaques_decoupe || []).includes(p));
  if (t.mode === "imprimer" && imprimables.length) versMachine("epson", T().vers_epson);
  if (page.traces_decoupe) {
    versMachine("kona", T().vers_kona);
    sortiesPage.append(el("a", { href: `${base}/decoupe.plt`, download: `decoupe-${String(n).padStart(3, "0")}.plt`, className: "meta" }, T().telecharger));
  }

  const tete = el("div", { className: "page-tete" },
    el("div", {}, t.pages.length > 1 ? el("strong", {}, T().page(n), " · ") : null, el("span", { className: "meta" }, T().decoupe(page.traces_decoupe))),
    sortiesPage);
  const bloc = el("div", { className: "page" }, tete);
  const e = page.estimation;
  if (t.mode === "imprimer" && e && e.surface_m2 > 0) {
    bloc.append(el("div", { className: "meta" }, T().estimation(nombre(e.surface_m2, 3), nombre(e.ml, 1), nombre(e.total, 2), nombre(e.cout_encres, 2), nombre(e.cout_support, 2))));
  }
  if (t.mode === "imprimer") {
    const cle = `${t.id}:${n}`;
    const caseP = el("input", { type: "checkbox", checked: selection.has(cle) });
    const copies = el("input", { type: "number", min: 1, max: 500, value: selection.get(cle) || 1, style: "width: 6em" });
    const maj = () => { caseP.checked ? selection.set(cle, Math.max(1, Math.min(500, +copies.value || 1))) : selection.delete(cle); majPlanche(); };
    caseP.addEventListener("change", maj); copies.addEventListener("change", maj);
    bloc.append(el("label", { className: "case" }, caseP, T().ajouter, " ", copies, " ", T().copies));
  }
  bloc.append(el("div", { className: "plaques" }, ...vignettes));
  return bloc;
}
