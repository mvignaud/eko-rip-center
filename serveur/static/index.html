<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-KO RIP Center</title>
<style>
  /* Thème sombre par défaut (atelier, écrans de production) ; clair au choix. */
  :root {
    --fond: #1b1f24; --barre: #14171b; --lateral: #181c21; --carte: #232930; --creux: #1e2329; --texte: #e6e9ec; --doux: #98a2ad; --trait: #333b44;
    --accent: #3d8fe0; --accent-doux: #1d3550; --ok: #4ac26b; --ok-doux: #15301f; --echec: #f97066; --echec-doux: #3a1d1b;
    --alerte: #f5b64f; --alerte-doux: #33280f; --attente: #a0aab4; --attente-doux: #2a313a; --ombre: none; --ligne-sel: #24405f;
  }
  :root[data-theme=clair] {
    --fond: #eef1f4; --barre: #ffffff; --lateral: #f7f8fa; --carte: #ffffff; --creux: #f5f7f9; --texte: #18202a; --doux: #5f6b78; --trait: #dce1e6;
    --accent: #0b6bcb; --accent-doux: #e3eefa; --ok: #1a7f37; --ok-doux: #e5f4ea; --echec: #b42318; --echec-doux: #fdecea;
    --alerte: #9a5b00; --alerte-doux: #fff4e0; --attente: #6b7280; --attente-doux: #eef0f3; --ombre: 0 1px 2px rgb(16 24 40 / .06); --ligne-sel: #d6e7fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--fond); color: var(--texte); }
  input, select, button { font: inherit; color: inherit; }
  input:not([type=checkbox]), select { background: var(--carte); border: 1px solid var(--trait); border-radius: 6px; padding: 6px 8px; min-width: 0; }
  input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 500; }
  button.discret { background: transparent; color: var(--accent); border: 1px solid var(--trait); padding: 4px 10px; font-weight: 400; }
  button.discret:hover { background: var(--accent-doux); }
  button.danger { color: var(--echec); }
  button:disabled { opacity: .5; cursor: default; }
  .erreur { color: var(--echec); }
  .meta { color: var(--doux); font-size: 13px; }
  [hidden] { display: none !important; }

  /* Coque : barre d'outils, latéral, contenu, inspecteur */
  body { height: 100vh; display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
  .barre { background: var(--barre); border-bottom: 1px solid var(--trait); display: flex; align-items: center; gap: 6px; padding: 6px 12px; flex-wrap: wrap; }
  .logo { font-weight: 700; font-size: 15px; letter-spacing: .2px; margin-right: 12px; white-space: nowrap; }
  .logo span { color: var(--accent); }
  .outil { background: transparent; color: var(--texte); border: 1px solid transparent; border-radius: 6px; padding: 5px 10px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
  .outil:hover:not(:disabled) { background: var(--accent-doux); border-color: var(--trait); }
  .outil.principal { background: var(--accent); color: #fff; }
  .outil .ico { font-size: 15px; line-height: 1; }
  .sep { width: 1px; align-self: stretch; background: var(--trait); margin: 2px 4px; }
  .barre .recherche { margin-left: auto; width: 220px; }
  .outils { display: flex; align-items: center; gap: 6px; }
  .bandeau { margin: 0; padding: 8px 16px; background: var(--echec-doux); color: var(--echec); }
  .coque { display: grid; grid-template-columns: 220px 1fr; min-height: 0; }
  .lateral { background: var(--lateral); border-right: 1px solid var(--trait); overflow: auto; padding: 10px 0; }
  .lateral h3 { margin: 14px 14px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--doux); }
  .lateral button.entree { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; background: none; color: var(--texte); border-radius: 0; padding: 7px 14px; font-weight: 400; text-align: left; }
  .lateral button.entree:hover { background: var(--accent-doux); }
  .lateral button.entree[aria-current=page] { background: var(--ligne-sel); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
  .lateral .pastille { font-size: 11px; border-radius: 10px; padding: 0 7px; background: var(--attente-doux); color: var(--attente); }
  .lateral .pastille.active { background: var(--accent); color: #fff; }
  .lateral .sous { display: block; font-size: 11px; color: var(--doux); font-weight: 400; }
  main { min-height: 0; overflow: auto; padding: 14px; }
  .vue-travaux { display: grid; grid-template-columns: 1fr 380px; gap: 14px; align-items: start; min-height: 100%; }
  @media (max-width: 1100px) { .vue-travaux { grid-template-columns: 1fr; } }
  @media (max-width: 760px) { .coque { grid-template-columns: 1fr; } .lateral { display: none; } body { overflow: auto; height: auto; } }
  .panneau { background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; box-shadow: var(--ombre); }
  .panneau > h2, .panneau > header { margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--trait); font-size: 13px; }
  .corps { padding: 14px; display: grid; gap: 12px; }
  #inspecteur { position: sticky; top: 0; max-height: calc(100vh - 90px); overflow: auto; }
  /* Tableau des travaux */
  table.tableau { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tableau th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--doux); padding: 8px 10px; border-bottom: 1px solid var(--trait); position: sticky; top: 0; background: var(--carte); }
  .tableau td { padding: 6px 10px; border-bottom: 1px solid var(--trait); vertical-align: middle; }
  .tableau tbody tr { cursor: pointer; }
  .tableau tbody tr:hover { background: var(--creux); }
  .tableau tbody tr[aria-selected=true] { background: var(--ligne-sel); }
  .tableau .mini { width: 52px; height: 38px; border-radius: 4px; border: 1px solid var(--trait); background: #fff center/contain no-repeat; }
  .tableau .mini.vide { background: var(--creux); }
  .tableau .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  dialog#importer form#envoi { width: min(460px, 92vw); max-height: 82vh; overflow: auto; }
  .entete-fenetre { display: flex; justify-content: space-between; align-items: center; }

  /* Formulaire */
  label { display: grid; gap: 4px; font-size: 12px; color: var(--doux); }
  label > select, label > input { color: var(--texte); font-size: 14px; }
  label.case { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texte); }
  label.lien { color: var(--accent); cursor: pointer; font-size: 13px; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  details.section { border: 1px solid var(--trait); border-radius: 8px; }
  details.section > summary { cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  details.section > summary::-webkit-details-marker { display: none; }
  details.section > summary::after { content: "▸"; color: var(--doux); }
  details.section[open] > summary::after { content: "▾"; }
  details.section > div { padding: 4px 12px 12px; display: grid; gap: 10px; }
  .depot { border: 2px dashed var(--trait); border-radius: 10px; padding: 18px 12px; text-align: center; color: var(--doux); cursor: pointer; background: var(--creux); }
  .depot strong { color: var(--texte); display: block; margin-bottom: 2px; font-size: 14px; }
  .depot:hover, body.glisse .depot { border-color: var(--accent); background: var(--accent-doux); }
  body.glisse::after { content: ""; position: fixed; inset: 0; border: 3px dashed var(--accent); pointer-events: none; z-index: 20; }
  .ligne { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ligne.bas { align-items: end; }
  .ligne > label { flex: 1; }
  #message { position: fixed; z-index: 30; left: 50%; bottom: 20px; transform: translateX(-50%); margin: 0; max-width: min(640px, calc(100vw - 32px));
    padding: 10px 16px; border-radius: 8px; background: var(--texte); color: var(--fond); box-shadow: 0 4px 16px rgb(0 0 0 / .25); font-size: 13px; }
  #message.erreur { background: var(--echec); color: #fff; }

  /* Liste des travaux */
  .filtres { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filtres input[type=search] { flex: 1; min-width: 180px; }
  .puce { background: var(--carte); color: var(--doux); border: 1px solid var(--trait); border-radius: 999px; padding: 4px 12px; font-weight: 400; }
  .puce[aria-pressed=true] { background: var(--accent-doux); color: var(--accent); border-color: var(--accent); }
  .vignette { width: 100%; aspect-ratio: 4 / 3; border-radius: 6px; border: 1px solid var(--trait); background: #fff center/contain no-repeat; }
  .vignette.vide { background: var(--creux); }
  .nom { font-weight: 600; overflow-wrap: anywhere; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; align-items: center; }
  .badge { font-size: 12px; border-radius: 999px; padding: 1px 8px; background: var(--attente-doux); color: var(--attente); white-space: nowrap; }
  .badge.termine, .badge.terminee { background: var(--ok-doux); color: var(--ok); }
  .badge.echec { background: var(--echec-doux); color: var(--echec); }
  .badge.alerte { background: var(--alerte-doux); color: var(--alerte); }
  ul.alertes { margin: 0; padding: 8px 12px 8px 28px; background: var(--alerte-doux); color: var(--alerte); border-radius: 8px; font-size: 13px; }
  .badge.en_cours { background: var(--accent-doux); color: var(--accent); }
  .badge.en_cours::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 5px; animation: pouls 1s infinite alternate; }
  @keyframes pouls { from { opacity: .3; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .badge.en_cours::before { animation: none; } }
  .detail { border-top: 1px solid var(--trait); padding: 12px; display: grid; gap: 12px; background: var(--creux); }
  .page { background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
  .page-tete { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .plaques { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  figure { margin: 0; }
  figure img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #fff; border: 1px solid var(--trait); border-radius: 6px; }
  figcaption { font-size: 12px; text-align: center; color: var(--doux); overflow-wrap: anywhere; }
  .vide-liste { text-align: center; color: var(--doux); padding: 32px 16px; margin: 0; }
  #planche { margin-bottom: 12px; }
  #planche .corps { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); align-items: end; }

  /* File d'attente */
  .vue-file { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 16px; align-items: start; }
  .sortie { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 10px 16px; border-top: 1px solid var(--trait); }
  .sortie:first-child { border-top: 0; }
  @media (max-width: 560px) { .sortie { grid-template-columns: 1fr; } }
  .sortie .actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; align-items: start; }
  .sortie .actions button { padding: 2px 8px; }
  .systeme dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; }
  .systeme dt { color: var(--doux); }
  .systeme dd { margin: 0; }
  .vue-systeme { display: grid; gap: 16px; }
  .tarifs { display: grid; grid-template-columns: minmax(120px, max-content) repeat(2, minmax(90px, 140px)); gap: 6px 12px; align-items: center; }
  .tarifs input { width: 100%; }
  .tarifs .tete { font-size: 12px; color: var(--doux); }
  .jauge { height: 8px; border-radius: 4px; background: var(--attente-doux); overflow: hidden; margin-top: 4px; max-width: 320px; }
  .jauge > div { height: 100%; background: var(--accent); }
  .jauge.basse > div { background: var(--echec); }

  dialog { border: 1px solid var(--trait); border-radius: 10px; background: var(--carte); color: var(--texte); padding: 0; box-shadow: var(--ombre); }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog form { display: grid; gap: 12px; padding: 20px; min-width: min(340px, 84vw); }
</style>
</head>
<body>
<header class="barre">
  <div class="logo">E-KO <span>RIP</span> Center</div>
  <button type="button" class="outil principal" id="ouvrir-importer"><span class="ico">＋</span><span data-t="importer"></span></button>
  <span class="sep"></span>
  <button type="button" class="outil" id="o-imprimer"><span class="ico">⎙</span><span data-t="o_imprimer"></span></button>
  <button type="button" class="outil" id="o-decouper"><span class="ico">✂</span><span data-t="o_decouper"></span></button>
  <button type="button" class="outil" id="o-editer"><span class="ico">✎</span><span data-t="editer"></span></button>
  <button type="button" class="outil" id="o-bat"><span class="ico">✓</span><span data-t="o_bat"></span></button>
  <button type="button" class="outil" id="o-relancer"><span class="ico">↻</span><span data-t="relancer"></span></button>
  <button type="button" class="outil" id="o-supprimer"><span class="ico">🗑</span><span data-t="supprimer"></span></button>
  <input type="search" id="recherche" class="recherche" data-t-placeholder="rechercher">
  <div class="outils">
    <span id="qui" class="meta"></span>
    <button type="button" id="deconnexion" class="discret" data-t="deconnexion" hidden></button>
    <button type="button" id="theme" class="discret" aria-label="Thème">◐</button>
    <button type="button" id="langue" class="discret"></button>
  </div>
</header>
<p id="acces-libre" class="bandeau" data-t="acces_libre" hidden></p>
<dialog id="fenetre-edition">
  <form id="form-edition">
    <strong id="titre-edition"></strong>
    <div id="edition-travail" style="display: grid; gap: 10px"></div>
    <p id="erreur-edition" class="erreur" role="alert"></p>
    <div class="ligne"><button data-t="appliquer"></button><button type="button" class="discret" id="fermer-edition" data-t="fermer"></button></div>
  </form>
</dialog>
<dialog id="visionneuse">
  <form method="dialog" style="padding: 12px; display: grid; gap: 8px; max-width: 92vw">
    <img id="image-vue" alt="" style="max-width: 88vw; max-height: 78vh; background: #fff; border: 1px solid var(--trait); border-radius: 6px">
    <div class="ligne" style="justify-content: space-between"><span id="legende-vue" class="meta"></span><button class="discret" data-t="fermer"></button></div>
  </form>
</dialog>
<dialog id="connexion">
  <form id="form-connexion">
    <strong data-t="connexion"></strong>
    <label><span data-t="nom_utilisateur"></span> <input name="nom" autocomplete="username" required></label>
    <label><span data-t="mot_de_passe"></span> <input name="mot_de_passe" type="password" autocomplete="current-password" required></label>
    <p id="erreur-connexion" class="erreur" role="alert"></p>
    <button data-t="se_connecter"></button>
  </form>
</dialog>

<dialog id="importer">
      <form id="envoi" class="corps">
        <div class="entete-fenetre"><strong data-t="nouveau_travail"></strong><button type="button" class="discret" id="fermer-importer" data-t="fermer"></button></div>
        <label class="depot">
          <strong data-t="deposer_ici"></strong><span data-t="fichier"></span>
          <input type="file" name="fichier" accept="application/pdf,.pdf,.ai,image/svg+xml,.svg" multiple hidden>
          <span id="nom-fichier" class="meta"></span>
        </label>
        <div class="ligne bas">
          <label><span data-t="reglage"></span> <select id="reglage"></select></label>
          <button type="button" class="discret" id="enregistrer-reglage" data-t="enregistrer_reglage"></button>
          <button type="button" class="discret danger" id="supprimer-reglage" data-t="supprimer_reglage"></button>
        </div>
        <div class="deux">
          <label><span data-t="mode"></span>
            <select name="mode"><option value="imprimer" data-t="imprimer"></option><option value="decouper" data-t="decouper"></option></select>
          </label>
          <label><span data-t="resolution"></span>
            <select name="dpi"><option>360</option><option selected>720</option><option>1440</option></select>
          </label>
        </div>
        <label><span data-t="traces"></span>
          <select name="traces"><option value="tons" data-t="tons"></option><option value="tous" data-t="tous"></option></select>
        </label>
        <label><span data-t="support_choix"></span> <select name="support"></select></label>
        <label><span data-t="reperage"></span>
          <select name="reperage"><option value="aucun" data-t="aucun"></option><option value="manuel" data-t="manuel"></option><option value="cadre" data-t="cadre"></option></select>
        </label>
        <details class="section" id="couleur"><summary data-t="couleur"></summary><div>
          <label><span data-t="profil_cmjn"></span><select name="profil_cmjn" data-espace="CMYK"></select></label>
          <label><span data-t="profil_rvb"></span><select name="profil_rvb" data-espace="RGB"></select></label>
          <label><span data-t="profil_sortie"></span><select name="profil_sortie" data-espace="CMYK"></select></label>
          <label><span data-t="intention"></span><select name="intention"></select></label>
          <label class="case"><input type="checkbox" name="forcer_profils" value="oui"> <span data-t="forcer"></span></label>
          <label class="lien"><span data-t="deposer"></span><input type="file" id="profil" accept=".icc,.icm" hidden></label>
        </div></details>
        <details class="section"><summary data-t="edition"></summary><div id="edition-envoi"></div></details>
        <details class="section"><summary data-t="auto"></summary><div>
          <label class="case"><input type="checkbox" name="auto_imprimer" value="oui"> <span data-t="auto_imprimer"></span></label>
          <label class="case"><input type="checkbox" name="auto_decouper" value="oui"> <span data-t="auto_decouper"></span></label>
          <label class="case"><input type="checkbox" name="auto_suspendre" value="oui"> <span data-t="auto_suspendre"></span></label>
          <p class="meta" style="margin: 0" data-t="note_auto"></p>
        </div></details>
        <details class="section"><summary data-t="blanc"></summary><div>
          <label><span data-t="blanc_mode"></span>
            <select name="blanc"><option value="aucun" data-t="blanc_aucun"></option><option value="sous_couche" data-t="blanc_sous_couche"></option><option value="aplat" data-t="blanc_aplat"></option></select>
          </label>
          <div class="deux">
            <label><span data-t="retraction"></span> <input type="number" name="blanc_retraction_mm" value="0.2" min="0" max="5" step="0.05"></label>
            <label><span data-t="seuil"></span> <input type="number" name="blanc_seuil" value="5" min="1" max="100" step="1"></label>
          </div>
          <p class="meta" style="margin: 0" data-t="note_blanc"></p>
        </div></details>
        <details class="section"><summary data-t="mosaique"></summary><div>
          <label class="case"><input type="checkbox" name="mosaique" value="oui"> <span data-t="mosaique_activer"></span></label>
          <div class="deux">
            <label><span data-t="laize"></span> <input type="number" name="laize_mm" value="1600" min="50" max="5000" step="1"></label>
            <label><span data-t="recouvrement"></span> <input type="number" name="recouvrement_mm" value="20" min="0" max="200" step="1"></label>
          </div>
          <label class="case"><input type="checkbox" name="reperes_les" value="oui"> <span data-t="reperes_les"></span></label>
        </div></details>
        <button type="submit" data-t="envoyer"></button>
      </form>
</dialog>

<div class="coque">
  <aside class="lateral">
    <nav aria-label="Navigation">
      <h3 data-t="vues"></h3>
      <button type="button" class="entree" data-vue="travaux"><span data-t="nav_travaux"></span><span id="compte-travaux" class="pastille"></span></button>
      <button type="button" class="entree" data-vue="file"><span data-t="nav_file"></span><span id="compte-file" class="pastille active" hidden></span></button>
      <button type="button" class="entree" data-vue="systeme"><span data-t="nav_systeme"></span></button>
    </nav>
    <h3 data-t="machines_titre"></h3>
    <div id="liste-machines"></div>
    <h3 data-t="reglages_titre"></h3>
    <div id="liste-reglages"></div>
  </aside>
<main>
  <section id="vue-travaux" class="vue-travaux">
    <div>
      <section id="planche" class="panneau" hidden style="margin-bottom: 14px">
        <header><strong data-t="planche"></strong></header>
        <div class="corps">
          <label><span data-t="laize"></span> <input type="number" id="laize" value="1600" min="50" max="5000" step="1"></label>
          <label><span data-t="espacement"></span> <input type="number" id="espacement" value="5" min="0" max="100" step="0.5"></label>
          <label class="case"><input type="checkbox" id="rotation"> <span data-t="rotation"></span></label>
          <button type="button" id="creer-planche"></button>
        </div>
        <div id="imposition" style="padding: 0 16px 16px"></div>
      </section>
      <div class="filtres">
        <button type="button" class="puce" data-filtre="" aria-pressed="true" data-t="filtre_tous"></button>
        <button type="button" class="puce" data-filtre="actif" aria-pressed="false" data-t="filtre_actifs"></button>
        <button type="button" class="puce" data-filtre="termine" aria-pressed="false" data-t="termine"></button>
        <button type="button" class="puce" data-filtre="echec" aria-pressed="false" data-t="echec"></button>
      </div>
      <section id="travaux" class="panneau" aria-live="polite"></section>
    </div>

/** Aperçu de l'imposition : la laize, les éléments à leur place, longueur et utilisation. */
let imposition = 0;
async function dessinerImposition() {
  const n = ++imposition;
  const corps = { laize_mm: +$("laize").value, espacement_mm: +$("espacement").value, rotation: $("rotation").checked, elements: elementsPlanche() };
  const r = await fetch("/api/planches/apercu", json("POST", corps)).catch(() => null);
  if (n !== imposition || !r) return;
  const c = await r.json().catch(() => ({}));
  if (!r.ok) { $("imposition").replaceChildren(el("p", { className: "erreur meta" }, texteErreur(c.code, c.detail))); return; }
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  const [l, h] = [c.laize_mm, Math.max(c.longueur_mm, 1)];
  svg.setAttribute("viewBox", `0 0 ${l} ${h}`);
  svg.setAttribute("style", "width: 100%; max-height: 360px");
  svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
  const trait = Math.max(l, h) / 400;
  // Le rouleau : laize × longueur consommée.
  const rouleau = document.createElementNS(ns, "rect");
  Object.entries({ x: 0, y: 0, width: l, height: h, fill: "var(--carte)", stroke: "var(--doux)", "stroke-width": trait, "stroke-dasharray": `${trait * 6} ${trait * 4}` }).forEach(([k, v]) => rouleau.setAttribute(k, v));
  svg.append(rouleau);
  c.places.forEach((p) => {
    // Le rouleau avance vers le bas de l'écran : y PDF retourné.
    const g = document.createElementNS(ns, "g");
    const rect = document.createElementNS(ns, "rect");
    Object.entries({ x: p.x, y: h - p.y - p.hauteur, width: p.largeur, height: p.hauteur, fill: "var(--accent-doux)", stroke: "var(--accent)", "stroke-width": trait }).forEach(([k, v]) => rect.setAttribute(k, v));
    const titre = document.createElementNS(ns, "title");
    titre.textContent = `${p.nom} — ${Math.round(p.largeur)} × ${Math.round(p.hauteur)} mm${p.tourne ? " ⟲" : ""}`;
    g.append(rect, titre);
    svg.append(g);
  });
  $("imposition").replaceChildren(svg, el("p", { className: "meta", style: "margin: 6px 0 0" }, T().imposition(Math.round(c.longueur_mm), Math.round(c.utilisation * 100))));
}

let media = null, erreurMedia = null;
async function chargerMedia() {
  const r = await fetch("/api/machines/epson/media").catch(() => null);
  const c = r ? await r.json().catch(() => ({})) : {};
  [media, erreurMedia] = r && r.ok ? [c.medias[0], null] : [null, r ? c : { code: "reseau" }];
  if (media) utiliserMedia(false);
  afficherMedia();
}
function utiliserMedia(dire_le) {
  if (!media) return;
  $("laize").value = Math.floor(media.largeur_mm);
  form.laize_mm.value = Math.floor(media.largeur_mm);
  if (dire_le) dire(T().laize_reglee(Math.floor(media.largeur_mm)));
  majPlanche();
}
function afficherMedia() {
  const z = $("media");
  if (media) {
    z.replaceChildren(el("p", { style: "margin: 0" }, T().media_charge(media.largeur_mm, media.nom)),
      el("div", { className: "ligne" }, bouton(T().utiliser_laize, () => utiliserMedia(true)), bouton(T().relire, chargerMedia)));
  } else {
    const code = erreurMedia?.code;
    z.replaceChildren(el("p", { className: code === "media_non_configure" ? "meta" : "erreur", style: "margin: 0" },
      code === "media_non_configure" ? T().media_non_configure : texteErreur(code, erreurMedia?.detail)), el("div", { className: "ligne" }, bouton(T().relire, chargerMedia)));
  }
}

/** Catalogue des machines ; les capacités suivent le modèle (comme côté serveur). */
let catalogue = [];
async function chargerMachines() {
  const c = await api("/api/machines");
  if (!c) return;
  catalogue = c.map((m) => ({ ...m, modele_imprime: ["epson_sc_s80600", "roland_versacamm"].includes(m.modele), modele_decoupe: m.modele !== "epson_sc_s80600" }));
  afficherLateral();
  afficherEditeurMachines();
  derniereEmpreinte = "";
  rafraichir();
}
function afficherLateral() {
  $("liste-machines").replaceChildren(...catalogue.map((m) => {
    const actives = sorties.filter((s) => s.machine === m.id && ["en_attente", "en_cours", "suspendue"].includes(s.etat));
    const enCours = actives.some((s) => s.etat === "en_cours");
    const b = el("button", { type: "button", className: "entree" },
      el("span", {}, m.nom, el("span", { className: "sous" }, enCours ? T().etats.en_cours : T().laize_mm(Math.round(m.laize_mm)))),
      el("span", { className: actives.length ? "pastille active" : "pastille" }, String(actives.length)));
    b.addEventListener("click", () => { montrer("file"); setTimeout(() => $(`file-${m.id}`)?.scrollIntoView({ block: "start" }), 50); });
    return b;
  }));
  $("liste-reglages").replaceChildren(...(reglages.length ? reglages.map((r) => {
    const b = el("button", { type: "button", className: "entree" }, el("span", {}, r.nom));
    b.addEventListener("click", () => { choixReglage.value = r.nom; appliquerDemande(r.demande); $("supprimer-reglage").hidden = false; $("importer").showModal(); });
    return b;
  }) : [el("p", { className: "meta", style: "margin: 0 14px" }, T().aucun_reglage_enregistre)]));
}

/** Éditeur du catalogue (Système > Machines). */
const MODELES = ["epson_sc_s80600", "mutoh_kona", "graphtec_fc7000", "roland_versacamm"];
const CONNEXIONS = ["serie", "reseau", "fichier", "dossier"];
function afficherEditeurMachines() {
  const f = $("editeur-machines");
  if (f.contains(document.activeElement)) return;
  const lignes = el("div", { id: "lignes-machines", style: "display: grid; gap: 10px" });
  const ligne = (m = { id: "", nom: "", modele: "graphtec_fc7000", laize_mm: 750, connexion: { type: "serie", port: "/dev/ttyUSB0", stty: "9600 cs8 -cstopb -parenb crtscts raw -echo" } }) => {
    const c = m.connexion || { type: "dossier" };
    const champ = (n, v, attrs = {}) => el("input", { name: n, value: v ?? "", ...attrs });
    const choix = (n, valeurs, v, textes) => el("select", { name: n }, ...valeurs.map((x) => el("option", { value: x, selected: x === v }, textes[x] || x)));
    const details = el("div", { className: "ligne bas" });
    const majConnexion = (type) => {
      details.replaceChildren(...({
        serie: [el("label", {}, T().port, champ("port", c.port || "/dev/ttyUSB0")), el("label", {}, "stty", champ("stty", c.stty || "9600 cs8 -cstopb -parenb crtscts raw -echo"))],
        reseau: [el("label", {}, T().hote, champ("hote", c.hote || "")), el("label", {}, T().port_tcp, champ("port_tcp", typeof c.port === "number" ? c.port : 9100, { type: "number", min: 1, max: 65535 }))],
        fichier: [el("label", {}, T().chemin, champ("chemin", c.chemin || "/dev/usb/lp0"))],
        dossier: [el("span", { className: "meta" }, T().connexion_dossier)],
      })[type]);
    };
    const typeConnexion = choix("type", CONNEXIONS, c.type, T().connexions);
    typeConnexion.addEventListener("change", () => majConnexion(typeConnexion.value));
    majConnexion(c.type);
    const bloc = el("div", { className: "page ligne-machine" },
      el("div", { className: "ligne bas" },
        el("label", {}, T().identifiant, champ("id", m.id, { placeholder: "fc7000", style: "width: 9em" })),
        el("label", { style: "flex: 2" }, T().nom_machine, champ("nom", m.nom)),
        el("label", {}, T().modele, choix("modele", MODELES, m.modele, T().modeles)),
        el("label", {}, T().laize, champ("laize", m.laize_mm, { type: "number", min: 100, max: 5000, style: "width: 7em" }))),
      el("div", { className: "ligne bas" },
        el("label", {}, T().connexion_machine, typeConnexion), details,
        el("label", {}, T().snmp, champ("snmp", m.snmp || "", { placeholder: "192.168.1.50" })),
        el("label", {}, T().pas, choix("pas", ["", "0.01", "0.025", "0.05", "0.1"], m.pas_mm == null ? "" : String(m.pas_mm), { "": T().pas_defaut }))));
    bloc.append(bouton(T().retirer_machine, () => bloc.remove(), "discret danger"));
    lignes.append(bloc);
  };
  catalogue.forEach((m) => ligne(m));
  f.replaceChildren(el("p", { className: "meta", style: "margin: 0" }, T().note_machines), lignes,
    el("div", { className: "ligne" }, bouton(T().ajouter_machine, () => ligne()), el("button", { type: "submit" }, T().enregistrer)));
}
$("editeur-machines").addEventListener("submit", async (e) => {
  e.preventDefault();
  const liste = [...$("lignes-machines").querySelectorAll(".ligne-machine")].map((b) => {
    const q = (n) => b.querySelector(`[name=${n}]`)?.value?.trim() ?? "";
    const type = q("type");
    const connexion = { type, ...(type === "serie" ? { port: q("port"), stty: q("stty") } : type === "reseau" ? { hote: q("hote"), port: +q("port_tcp") } : type === "fichier" ? { chemin: q("chemin") } : {}) };
    return { id: q("id"), nom: q("nom"), modele: q("modele"), laize_mm: +q("laize"), connexion, snmp: q("snmp") || null, pas_mm: q("pas") ? +q("pas") : null };
  });
  if (await api("/api/machines", json("POST", liste))) { document.activeElement.blur(); dire(T().machines_enregistrees); await chargerMachines(); afficherEditeurMachines(); }
});

// Thème sombre (par défaut) ou clair, gardé sur le poste.
const appliquerTheme = (t) => { document.documentElement.dataset.theme = t; try { localStorage.setItem("theme", t); } catch {} };
appliquerTheme((() => { try { return localStorage.getItem("theme"); } catch { return null; } })() || "sombre");
$("theme").addEventListener("click", () => appliquerTheme(document.documentElement.dataset.theme === "clair" ? "sombre" : "clair"));

$("ouvrir-importer").addEventListener("click", () => $("importer").showModal());
$("fermer-importer").addEventListener("click", () => $("importer").close());

function toutCharger() {
  chargerMachines();
  chargerMedia();
  chargerProfils().then(chargerReglages);
  chargerTarifs();
  chargerSysteme();
  rafraichir();
}
appliquerLangue();
chargerSession();
montrer(location.hash.slice(1));
toutCharger();
setInterval(rafraichir, 3000);
setInterval(chargerSysteme, 60000);
</script>
