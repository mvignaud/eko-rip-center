<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-KO RIP Center</title>
<style>
  /* Thème sombre par défaut (atelier, écrans de production) ; clair au choix. */
  :root {
    --fond: #1b1f24; --barre: #14171b; --lateral: #181c21; --carte: #232930; --creux: #1e2329; --texte: #e6e9ec; --doux: #98a2ad; --trait: #333b44;
    --accent: #3d8fe0; --accent-doux: #1d3550; --ok: #4ac26b; --ok-doux: #15301f; --echec: #f97066; --echec-doux: #3a1d1b;
    --alerte: #f5b64f; --alerte-doux: #33280f; --attente: #a0aab4; --attente-doux: #2a313a; --ombre: none; --ligne-sel: #24405f;
  }
  :root[data-theme=clair] {
    --fond: #eef1f4; --barre: #ffffff; --lateral: #f7f8fa; --carte: #ffffff; --creux: #f5f7f9; --texte: #18202a; --doux: #5f6b78; --trait: #dce1e6;
    --accent: #0b6bcb; --accent-doux: #e3eefa; --ok: #1a7f37; --ok-doux: #e5f4ea; --echec: #b42318; --echec-doux: #fdecea;
    --alerte: #9a5b00; --alerte-doux: #fff4e0; --attente: #6b7280; --attente-doux: #eef0f3; --ombre: 0 1px 2px rgb(16 24 40 / .06); --ligne-sel: #d6e7fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--fond); color: var(--texte); }
  input, select, button { font: inherit; color: inherit; }
  input:not([type=checkbox]), select { background: var(--carte); border: 1px solid var(--trait); border-radius: 6px; padding: 6px 8px; min-width: 0; }
  input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 500; }
  button.discret { background: transparent; color: var(--accent); border: 1px solid var(--trait); padding: 4px 10px; font-weight: 400; }
  button.discret:hover { background: var(--accent-doux); }
  button.danger { color: var(--echec); }
  button:disabled { opacity: .5; cursor: default; }
  .bouton { display: inline-block; color: var(--accent); border: 1px solid var(--trait); border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer; text-decoration: none; }
  .bouton:hover { background: var(--accent-doux); }
  .apercu-principal figure { margin: 0; }
  .apercu-principal img { width: 100%; max-height: 360px; object-fit: contain; background: #fff; border: 1px solid var(--trait); border-radius: 6px; }
  .apercu-principal figcaption { display: none; }
  .encres { display: flex; gap: 6px; flex-wrap: wrap; }
  .encre { display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--doux); }
  .jauge-encre { width: 18px; height: 44px; border: 1px solid var(--trait); border-radius: 3px; display: flex; align-items: flex-end; overflow: hidden; }
  .niveau-encre { width: 100%; background: var(--accent); }
  .niveau-encre.bas { background: var(--echec); }
  .rangee { display: flex; gap: 8px; flex-wrap: wrap; }
  .erreur { color: var(--echec); }
  .meta { color: var(--doux); font-size: 13px; }
  [hidden] { display: none !important; }
  body[data-role="operateur"] .admin { display: none !important; }

  /* Coque : barre d'outils, latéral, contenu, inspecteur */
  body { height: 100vh; display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
  .barre { background: var(--barre); border-bottom: 1px solid var(--trait); display: flex; align-items: center; gap: 6px; padding: 6px 12px; flex-wrap: wrap; }
  .logo { font-weight: 700; font-size: 15px; letter-spacing: .2px; margin-right: 6px; white-space: nowrap; }
  .logo span { color: var(--accent); }
  .outil { background: transparent; color: var(--texte); border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; white-space: nowrap; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
  .outil:hover:not(:disabled) { background: var(--accent-doux); border-color: var(--trait); }
  .outil.principal { background: var(--accent); color: #fff; }
  .outil .ico { font-size: 15px; line-height: 1; }
  .sep { width: 1px; align-self: stretch; background: var(--trait); margin: 2px 4px; }
  .barre .recherche { margin-left: auto; width: 170px; min-width: 110px; flex: 0 1 170px; }
  /* Écran moyen : les outils gardent leur symbole, le libellé passe en bulle. */
  @media (max-width: 1360px) { .barre .outil:has(.ico) span:not(.ico) { display: none; } }
  .outils { display: flex; align-items: center; gap: 6px; }
  .bandeau { margin: 0; padding: 8px 16px; background: var(--echec-doux); color: var(--echec); }
  .coque { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .vues { display: flex; gap: 2px; }
  .vues .outil[aria-current=page] { background: var(--ligne-sel); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 600; }
  .pastille { font-size: 11px; border-radius: 10px; padding: 0 7px; background: var(--attente-doux); color: var(--attente); }
  .pastille.active { background: var(--accent); color: #fff; }
  .teinte { display: inline-block; width: 1.2em; height: 1.2em; border-radius: 3px; border: 1px solid var(--bord, #8884); vertical-align: middle; }
  main { min-height: 0; overflow: auto; padding: 14px; }
  .vue-travaux { display: grid; grid-template-columns: 1fr 380px; gap: 14px; align-items: start; min-height: 100%; }
  @media (max-width: 1100px) { .vue-travaux { grid-template-columns: 1fr; } }
  @media (max-width: 760px) { body { overflow: auto; height: auto; } }
  .panneau { background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; box-shadow: var(--ombre); }
  .panneau > h2, .panneau > header { margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--trait); font-size: 13px; }
  .corps { padding: 14px; display: grid; gap: 12px; }
  .colonne-inspecteur { position: sticky; top: 0; max-height: calc(100vh - 90px); overflow: auto; }
  .onglets { display: flex; gap: 2px; border-bottom: 1px solid var(--trait); padding: 0 8px; position: sticky; top: 0; background: var(--carte); z-index: 1; }
  .onglet { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 9px 10px; color: var(--doux); font-weight: 600; }
  .onglet[aria-selected=true] { color: var(--accent); border-bottom-color: var(--accent); }
  .onglet-corps { padding: 12px 16px; display: grid; gap: 10px; }
  .cible-reglage { border: 1px dashed var(--trait); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
  .cible-reglage.survol { border-color: var(--accent); background: var(--accent-doux); }
  .journal-ecran { list-style: none; margin: 0; padding: 0; font-size: 12px; }
  .journal-ecran li { padding: 4px 0; border-bottom: 1px solid var(--trait); }
  /* Tableau des travaux */
  table.tableau { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tableau th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--doux); padding: 8px 10px; border-bottom: 1px solid var(--trait); position: sticky; top: 0; background: var(--carte); }
  .tableau td { padding: 6px 10px; border-bottom: 1px solid var(--trait); vertical-align: middle; }
  .tableau tbody tr { cursor: pointer; }
  .tableau tbody tr:hover { background: var(--creux); }
  .tableau tbody tr[aria-selected=true] { background: var(--ligne-sel); }
  .tableau .mini { width: 52px; height: 38px; border-radius: 4px; border: 1px solid var(--trait); background: #fff center/contain no-repeat; }
  .tableau .mini.vide { background: var(--creux); }
  .tableau .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  dialog#importer form#envoi { width: min(460px, 92vw); max-height: 82vh; overflow: auto; }
  .entete-fenetre { display: flex; justify-content: space-between; align-items: center; }

  /* Formulaire */
  label { display: grid; gap: 4px; font-size: 12px; color: var(--doux); }
  label > select, label > input { color: var(--texte); font-size: 14px; }
  label.case { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texte); }
  label.lien { color: var(--accent); cursor: pointer; font-size: 13px; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  details.section { border: 1px solid var(--trait); border-radius: 8px; }
  details.section > summary { cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  details.section > summary::-webkit-details-marker { display: none; }
  details.section > summary::after { content: "▸"; color: var(--doux); }
  details.section[open] > summary::after { content: "▾"; }
  details.section > div { padding: 4px 12px 12px; display: grid; gap: 10px; }
  .depot { border: 2px dashed var(--trait); border-radius: 10px; padding: 18px 12px; text-align: center; color: var(--doux); cursor: pointer; background: var(--creux); }
  .depot strong { color: var(--texte); display: block; margin-bottom: 2px; font-size: 14px; }
  .depot:hover, body.glisse .depot { border-color: var(--accent); background: var(--accent-doux); }
  body.glisse::after { content: ""; position: fixed; inset: 0; border: 3px dashed var(--accent); pointer-events: none; z-index: 20; }
  .ligne { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ligne.bas { align-items: end; }
  .ligne > label { flex: 1; }
  #message { position: fixed; z-index: 30; left: 50%; bottom: 20px; transform: translateX(-50%); margin: 0; max-width: min(640px, calc(100vw - 32px));
    padding: 10px 16px; border-radius: 8px; background: var(--texte); color: var(--fond); box-shadow: 0 4px 16px rgb(0 0 0 / .25); font-size: 13px; }
  #message.erreur { background: var(--echec); color: #fff; }
  .envoi-en-cours { position: fixed; z-index: 31; right: 20px; bottom: 20px; width: min(380px, calc(100vw - 40px)); background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; box-shadow: var(--ombre); padding: 12px 14px; display: grid; gap: 6px; }
  .envoi-en-cours .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .envoi-en-cours progress { width: 100%; height: 8px; accent-color: var(--accent); }

  /* Liste des travaux */
  .filtres label { display: inline-flex; gap: 6px; align-items: center; }
  .filtres { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filtres input[type=search] { flex: 1; min-width: 180px; }
  .puce { background: var(--carte); color: var(--doux); border: 1px solid var(--trait); border-radius: 999px; padding: 4px 12px; font-weight: 400; }
  .puce[aria-pressed=true] { background: var(--accent-doux); color: var(--accent); border-color: var(--accent); }
  .vignette { width: 100%; aspect-ratio: 4 / 3; border-radius: 6px; border: 1px solid var(--trait); background: #fff center/contain no-repeat; }
  .vignette.vide { background: var(--creux); }
  .nom { font-weight: 600; overflow-wrap: anywhere; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; align-items: center; }
  .badge { font-size: 12px; border-radius: 999px; padding: 1px 8px; background: var(--attente-doux); color: var(--attente); white-space: nowrap; }
  .badge.termine, .badge.terminee { background: var(--ok-doux); color: var(--ok); }
  .badge.echec { background: var(--echec-doux); color: var(--echec); }
  .badge.alerte { background: var(--alerte-doux); color: var(--alerte); }
  ul.alertes { margin: 0; padding: 8px 12px 8px 28px; background: var(--alerte-doux); color: var(--alerte); border-radius: 8px; font-size: 13px; }
  .badge.en_cours { background: var(--accent-doux); color: var(--accent); }
  .badge.en_cours::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 5px; animation: pouls 1s infinite alternate; }
  @keyframes pouls { from { opacity: .3; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .badge.en_cours::before { animation: none; } }
  .detail { border-top: 1px solid var(--trait); padding: 12px; display: grid; gap: 12px; background: var(--creux); }
  .page { background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
  .page-tete { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .plaques { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  figure { margin: 0; }
  figure img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #fff; border: 1px solid var(--trait); border-radius: 6px; }
  figcaption { font-size: 12px; text-align: center; color: var(--doux); overflow-wrap: anywhere; }
  .vide-liste { text-align: center; color: var(--doux); padding: 32px 16px; margin: 0; }
  #planche { margin-bottom: 12px; }
  #planche .corps { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); align-items: end; }

  /* File d'attente */
  .bandeau-machines { margin-bottom: 14px; }
  .bandeau-machines tr[aria-current=true] { background: var(--accent-doux); }
  .bandeau-machines .encres { display: flex; gap: 3px; }
  .compteurs-file { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 10px 8px; }
  .compteurs-file .jauge { flex: 0 1 160px; margin-top: 0; }
  .bandeau-machines .jauge-encre { height: 22px; width: 8px; }
  .bandeau-machines .encre span { display: none; }
  .zone-file { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 6px; align-items: start; }
  .actions-file { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; }
  .actions-file button { width: 34px; height: 30px; padding: 0; font-size: 15px; }
  .zone-imprimes { margin-top: 14px; }
  .menu-contexte { position: fixed; z-index: 50; background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; box-shadow: var(--ombre); padding: 4px; min-width: 210px; display: grid; }
  .menu-contexte button { background: none; color: var(--texte); text-align: left; border-radius: 4px; padding: 6px 10px; font-weight: 400; }
  .menu-contexte button:hover:not(:disabled) { background: var(--accent-doux); }
  .menu-contexte button.danger { color: var(--echec); }
  .menu-contexte hr { border: 0; border-top: 1px solid var(--trait); margin: 4px 0; }
  .tableau tr.cible-depot { box-shadow: inset 0 2px 0 var(--accent); }
  .tableau tr[draggable=true] { cursor: grab; }
  .zone-imprimes > summary { padding: 10px 16px; cursor: pointer; font-weight: 600; }
  .sortie { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 10px 16px; border-top: 1px solid var(--trait); }
  .sortie:first-child { border-top: 0; }
  @media (max-width: 560px) { .sortie { grid-template-columns: 1fr; } }
  .sortie .actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; align-items: start; }
  .sortie .actions button { padding: 2px 8px; }
  .systeme dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; }
  .systeme dt { color: var(--doux); }
  .systeme dd { margin: 0; }
  .vue-systeme { display: grid; gap: 16px; }
  .tarifs { display: grid; grid-template-columns: minmax(120px, max-content) repeat(2, minmax(90px, 140px)); gap: 6px 12px; align-items: center; }
  .tarifs input { width: 100%; }
  .table-journal { overflow-x: auto; }
  .table-journal table { border-collapse: collapse; font-size: 12px; width: 100%; }
  .table-journal th, .table-journal td { padding: 3px 6px; border-bottom: 1px solid var(--bord, #ddd); text-align: left; white-space: nowrap; }
  .table-journal th { color: var(--doux); font-weight: normal; }
  .tarifs .tete { font-size: 12px; color: var(--doux); }
  .jauge { height: 8px; border-radius: 4px; background: var(--attente-doux); overflow: hidden; margin-top: 4px; max-width: 320px; }
  .jauge > div { height: 100%; background: var(--accent); }
  .jauge.basse > div { background: var(--echec); }

  dialog { border: 1px solid var(--trait); border-radius: 10px; background: var(--carte); color: var(--texte); padding: 0; box-shadow: var(--ombre); }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog form { display: grid; gap: 12px; padding: 20px; min-width: min(340px, 84vw); }
  /* Visionneuse façon éditeur : outils en haut, règles en mm, page au centre, état en bas. */
  dialog#visionneuse { width: 96vw; height: 92vh; max-width: none; max-height: none; }
  #visionneuse form { height: 100%; padding: 0; gap: 0; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; }
  .vue-outils { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border-bottom: 1px solid var(--trait); }
  .vue-cadre { display: grid; grid-template-columns: 24px minmax(0, 1fr); grid-template-rows: 24px minmax(0, 1fr); min-height: 0; overflow: hidden; }
  /* Hors du flux : la taille en pixels de la toile ne doit pas agrandir la grille. */
  .vue-cadre > div:first-child, .vue-regle { position: relative; }
  .vue-regle canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #vue-zone { position: relative; overflow: hidden; background: var(--creux); cursor: grab; touch-action: none; }
  #vue-zone[data-outil=loupe] { cursor: zoom-in; }
  #vue-zone:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* Pages d'un multipage à gauche, aperçu au centre, couches à droite. */
  .vue-corps { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; min-height: 0; }
  /* Colonnes fixées : sans vignettes (une page), la vue reste au milieu. */
  .vue-corps > .vue-cadre { grid-column: 2; } .vue-corps > .vue-lateral { grid-column: 3; }
  #vue-pages { display: flex; flex-direction: column; gap: 8px; width: 104px; padding: 8px; overflow-y: auto; border-right: 1px solid var(--trait); }
  #vue-pages[hidden] { display: none; }
  #vue-pages button { display: grid; gap: 2px; padding: 3px; border: 2px solid transparent; border-radius: 4px; background: none; color: var(--texte); font-size: 11px; cursor: pointer; }
  #vue-pages button[aria-current=page] { border-color: var(--accent); font-weight: 600; }
  #vue-pages img { width: 100%; display: block; background: #fff; box-shadow: 0 0 0 1px var(--trait); }
  .vue-lateral { display: grid; align-content: start; gap: 14px; width: 200px; padding: 10px; border-left: 1px solid var(--trait); font-size: 13px; overflow-y: auto; }
  #vue-couches, #vue-edition { display: grid; align-content: start; gap: 6px; }
  #vue-edition[hidden], #vue-edition [hidden] { display: none; }
  #vue-edition input[type=number] { width: 100%; }
  #vue-edition .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .vue-ancrage { display: grid; grid-template-columns: repeat(3, 26px); gap: 3px; }
  .vue-ancrage button { width: 26px; height: 22px; padding: 0; }
  .vue-ancrage button[aria-pressed=true] { background: var(--accent); color: #fff; }
  #vue-cadre-ed { position: absolute; outline: 1px dashed var(--accent); pointer-events: none; }
  #vue-cadre-ed.recadrer { box-shadow: 0 0 0 100000px rgb(0 0 0 / .35); }
  #vue-cadre-ed span { position: absolute; width: 10px; height: 10px; background: #fff; border: 1px solid var(--accent); transform: translate(-50%, -50%); }
  .vue-pastille { display: inline-block; width: 10px; height: 10px; border-radius: 2px; box-shadow: 0 0 0 1px var(--trait); }
  #vue-scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* Sélection : cadre et 8 poignées (sans action avant 3.B). */
  #vue-selection { position: absolute; inset: 0; outline: 1px solid var(--accent); pointer-events: none; }
  #vue-selection span { position: absolute; width: 8px; height: 8px; background: #fff; border: 1px solid var(--accent); transform: translate(-50%, -50%); }
  #vue-scene { background: #fff; position: absolute; left: 0; top: 0; box-shadow: 0 0 0 1px var(--trait), 0 2px 10px rgb(0 0 0 / .25); }
  #vue-scene img { position: absolute; inset: 0; width: 100%; height: 100%; background: #fff; user-select: none; pointer-events: none; }
  #vue-scene #vue-decoupe { background: transparent; mix-blend-mode: multiply; }
  #vue-scission { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--accent); pointer-events: none; }
  #vue-edition details :is(input[type=text], input[type=range], select) { width: 100%; min-width: 0; box-sizing: border-box; }
  #vue-edition details .deux { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .vue-courbes { width: 100%; max-width: 180px; aspect-ratio: 1; background: #fff; box-shadow: 0 0 0 1px var(--trait); }
  #vue-laize { position: absolute; left: 0; top: -100000px; bottom: -100000px; border-left: 2px dashed var(--accent); border-right: 2px dashed var(--accent); background: rgb(61 143 224 / .06); pointer-events: none; }
  #vue-hors { position: absolute; top: 0; bottom: 0; background: rgb(249 112 102 / .3); pointer-events: none; }
  /* Mosaïque (3.C) : lés en pointillés, recouvrements teintés, soudure, tuiles décochées. */
  #vue-les-calque, #vue-kona-calque { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  #vue-kona-calque rect { fill: rgb(0 0 0 / .55); stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 2; }
  #vue-les-calque .le { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 6 4; }
  #vue-les-calque .rec { fill: rgb(61 143 224 / .22); }

async function envoyerFichier(fichier) {
  const corps = new FormData(form);
  [...corps.keys()].filter((k) => k.startsWith("ed_")).forEach((k) => corps.delete(k));
  corps.set("edition", JSON.stringify(lireEdition($("edition-envoi"))));
  if (fichier) corps.set("fichier", fichier, fichier.name);
  dire(T().envoi);

  const c = await new Promise((fini) => {
    const x = new XMLHttpRequest(), debut = Date.now();
    let vu = 0;
    x.open("POST", "/api/travaux");
    // Cadre de progression (bas droite) : barre pendant l'envoi, puis barre animée pendant
    // que le serveur convertit et contrôle le fichier.
    const cadre = $("envoi-en-cours"), barre = $("envoi-barre");
    $("envoi-nom").textContent = fichier?.name || "";
    barre.value = 0;
    $("envoi-detail").textContent = T().envoi;
    const fermer = () => { cadre.hidden = true; };
    x.upload.onprogress = (e) => {
      if (!e.lengthComputable || e.total < 5e6 || Date.now() - vu < 300) return;
      vu = Date.now();
      cadre.hidden = false;
      const part = e.loaded / e.total, ecoule = (Date.now() - debut) / 1000;
      const reste = part > 0.02 ? Math.round(ecoule * (1 - part) / part) : null;
      barre.value = part;
      $("envoi-detail").textContent = T().envoi_progres(Math.round(e.loaded / 1048576), Math.round(e.total / 1048576), Math.round(part * 100), reste);
    };
    x.upload.onload = () => { if (!cadre.hidden) { barre.removeAttribute("value"); $("envoi-detail").textContent = T().envoi_traitement; } };

    x.onload = () => {
      fermer();
      let r = {};
      try { r = JSON.parse(x.responseText); } catch {}
      if (x.status >= 200 && x.status < 300) return fini(r);
      if (x.status === 413) dire(texteErreur("trop_gros"), true);
      else if (x.status === 401) { if (!fenetreConnexion.open) fenetreConnexion.showModal(); }
      else dire(texteErreur(r.code, r.detail), true);
      fini(null);
    };
    x.onerror = () => { fermer(); dire(texteErreur("reseau"), true); fini(null); };
    x.send(corps);
  });
  if (c) dire(T().recu(c.nom));
  return c;
}

async function rafraichir() {
  const lire = (url) => fetch(url).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  // Planches en préparation (roadmap 5.4) : lues seulement pour la file, s'il y a lieu.
  const avecNid = vueCourante() === "travaux" && catalogue.some((m) => (m.imbrication?.strategie || "un_par_un") !== "un_par_un");
  const [t, s, n, c] = await Promise.all([lire("/api/travaux"), lire("/api/file"), avecNid ? lire("/api/imbrications") : Promise.resolve([]), vueCourante() === "travaux" ? lire("/api/systeme") : Promise.resolve(null)]);
  if (t) travaux = t;
  if (c) compteursFile = c;
  if (n) imbrications = n;
  if (s) { signalerFins(sorties, s); sorties = s; }
  const aPasser = sorties.filter((x) => ["en_attente", "en_cours", "suspendue"].includes(x.etat)).length;
  $("compte-file").hidden = !aPasser; $("compte-file").textContent = aPasser;
  afficherLateral();
  // Reconstruire seulement si quelque chose a changé : un clic en cours ne doit pas tomber
  // sur un bouton remplacé entre l'appui et le relâchement.
  const empreinte = JSON.stringify([t, s, n, vueCourante(), c && [c.tampon, partOccupee(c)]]);
  if (empreinte === derniereEmpreinte) return;
  derniereEmpreinte = empreinte;
  afficherVue();
}
let derniereEmpreinte = "";
/** Une sortie qui vient de finir ou d'échouer est dite à l'écran, et au système si permis. */
let premierReleve = true;
function signalerFins(avant, apres) {
  // Au premier relevé, tout l'historique est déjà fini : rien à dire.
  if (premierReleve) { premierReleve = false; return; }
  for (const s of apres) {
    // Une sortie peut naître et finir entre deux relevés : nouvelle et finie compte aussi.
    const a = avant.find((x) => x.id === s.id);
    if (a?.etat === s.etat || !["terminee", "echec"].includes(s.etat)) continue;
    const machine = catalogue.find((m) => m.id === s.machine)?.nom || s.machine;
    const texte = T()[s.etat === "echec" ? "notif_echec" : "notif_finie"](s.nom, machine);
    dire(texte, s.etat === "echec");
    try { if (window.Notification?.permission === "granted") new Notification("E-KO RIP Center", { body: texte }); } catch {}
  }
  // Découpe retirée de la file dès la fin (« Après coupe : supprimer ») : finie aussi.
  for (const a of avant.filter((x) => x.etat === "en_cours" && !apres.some((y) => y.id === x.id))) {
    dire(T().notif_finie(a.nom, catalogue.find((m) => m.id === a.machine)?.nom || a.machine));
  }
}
// Demandée une fois, au premier clic (les navigateurs l'exigent après un geste).
document.addEventListener("click", () => { try { if (window.Notification?.permission === "default") Notification.requestPermission(); } catch {} }, { once: true });

let selectionne = null;

/** Lignes de la vue Production : « à imprimer » (sorties en file, dans l'ordre de la file,
 *  puis travaux jamais envoyés) et « imprimés » (sorties finies, la plus récente d'abord). */
function lignesProduction() {
  const q = $("recherche").value.trim().toLowerCase();
  const trouve = (t, s) => !q || [s?.nom, t?.nom, t?.fiche?.commande, t?.fiche?.client, t?.fiche?.societe].some((x) => x && x.toLowerCase().includes(q));
  const pool = catalogue.find((m) => m.id === filtreMachine)?.pool;
  const aImprimer = [], imprimes = [];
  for (const s of sorties) {
    const t = travaux.find((x) => x.id === s.travail);
    if ((filtreMachine && s.machine !== filtreMachine && s.machine !== pool) || !trouve(t, s)) continue;
    (aPasser(s) ? aImprimer : imprimes).push({ t, s });
  }
  if (!filtreMachine) aImprimer.push(...travaux.filter((t) => trouve(t) && !sorties.some((s) => s.travail === t.id)).map((t) => ({ t })));
  // Tri par échéance (roadmap 5.6) : la plus proche d'abord, sans échéance ensuite.
  const echeance = (x) => x.t?.fiche?.echeance ?? x.s?.fiche?.echeance ?? Infinity;
  if ($("tri").value === "echeance") aImprimer.sort((a, b) => echeance(a) - echeance(b));
  imprimes.sort((a, b) => (b.s.fin || b.s.cree_le) - (a.s.fin || a.s.cree_le));
  return { aImprimer, imprimes };
}

    : el("p", { className: "vide-liste" }, T().aucun_imprime));
  afficherActionsFile();

/** Dessin d'une imposition (planche manuelle ou imbrication de la file) : la laize × la

  svg.append(rouleau);

    formes.forEach((f) => Object.entries({ fill: "var(--accent-doux)", stroke: "var(--accent)", "stroke-width": trait }).forEach(([k, v]) => f.setAttribute(k, v)));
    const titre = document.createElementNS(ns, "title");
    titre.textContent = `${p.nom} — ${Math.round(p.largeur)} × ${Math.round(p.hauteur)} mm${p.angle ? ` · ${p.angle}°` : ""}`;
    g.append(...formes, titre);

}

$("editeur-machines").addEventListener("submit", async (e) => {
  e.preventDefault();
  const blocs = [...$("lignes-machines").querySelectorAll(".ligne-machine")];
  const lues = blocs.map((b) => {
    const q = (n) => b.querySelector(`[name=${n}]`)?.value?.trim() ?? "";
    const nv = (n) => (q(n) === "" ? null : +q(n));
    // Variante : complétée plus bas depuis sa machine d'origine (le serveur la recopie aussi).
    if (b.dataset.variante) return { id: q("id"), uuid: b.dataset.uuid || null, nom: q("nom"), variante_de: b.dataset.variante, reperage: q("reperage") || null };
    const type = q("type");
    const connexion = { type, ...(type === "serie" ? { port: q("port"), stty: q("stty") } : type === "reseau" ? { hote: q("hote"), port: +q("port_tcp") } : type === "ipp" ? { hote: q("hote"), port: +q("port_tcp"), chemin: q("chemin_ipp") } : type === "rip_eko" ? { hote: q("hote"), port: +q("port_tcp"), machine: q("machine_distante"), jeton: q("jeton") } : type === "fichier" ? { chemin: q("chemin") } : {}) };
    return { id: q("id"), uuid: b.dataset.uuid || null, nom: q("nom"), modele: q("modele"), laize_mm: +q("laize"), connexion, snmp: q("snmp") || null, pas_mm: q("pas") ? +q("pas") : null, decalage_mm: [+q("decalage_x") || 0, +q("decalage_y") || 0], origine_impression_mm: [+q("origine_x") || 0, +q("origine_y") || 0], m2_heure: q("cadence") ? +q("cadence") : null, pool: q("pool") || null,
      parametres_decoupe: [...b.querySelectorAll(".ligne-coupe")].map((r) => {
        const v = (n) => r.querySelector(`[name=${n}]`).value;
        return { uuid: r.dataset.uuid || null, nom: v("c_nom").trim(), vitesse_cm_s: +v("c_vitesse"), force_g: +v("c_force"), acceleration_g: +v("c_acc"), valeurs_machine: r.querySelector("[name=c_massicot]").checked,
          outil: v("c_outil") ? +v("c_outil") : null, diffusion: r.querySelector("[name=c_diffusion]").checked,
          // « 8/2 8/2 4/1 » : paires coupé/relevé en mm (virgule décimale acceptée).
          motif_mm: v("c_motif").trim() ? v("c_motif").trim().split(/\s+/).map((x) => x.replace(/,/g, ".").split("/").map(Number)).map(([b, h]) => [b || 0, h || 0]) : [] };
      }).filter((p) => p.nom),
      decoupe_retournee: b.querySelector("[name=retournee]").checked, mono_couche: b.querySelector("[name=mono_couche]").checked, coupe_auto: b.querySelector("[name=coupe_auto]").checked,
      imbrication: b.querySelector("[name=n_strategie]") ? { strategie: q("n_strategie"), delai_min: nv("n_delai"), surface_m2: nv("n_surface"), longueur_cible_mm: nv("n_longueur"), remplissage_pct: nv("n_pct"), espace_mm: nv("n_espace") ?? 5, marge_haut_mm: nv("n_haut") ?? 0, marge_bas_mm: nv("n_bas") ?? 0, contour: b.querySelector("[name=n_contour]").checked,
        inactivite_min: nv("n_inactivite"), longueur_max_mm: nv("n_lmax"), rangee_pleine: b.querySelector("[name=n_rangee]").checked, chargement: q("n_chargement"),
        espace_vertical_mm: nv("n_espace_v"), justification: q("n_justif"), decalage_x_mm: nv("n_decalage") ?? 0, purge_cote: q("n_purge") || null, purge_mm: nv("n_purge_mm") ?? 10,
