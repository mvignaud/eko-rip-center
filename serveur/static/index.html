<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-KO RIP Center</title>
<style>
  :root { --fond: #f6f7f9; --carte: #fff; --texte: #1d232b; --doux: #66707c; --trait: #dde1e6; --accent: #0b6bcb; --echec: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #14181d; --carte: #1d232b; --texte: #e8ebee; --doux: #9aa4ae; --trait: #2f3842; --accent: #5aa7f0; --echec: #f97066; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--fond); color: var(--texte); }
  header, main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0; }
  form { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 16px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--doux); }
  input, select, button { font: inherit; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
  button.discret { background: none; color: var(--accent); border: 1px solid var(--trait); padding: 4px 10px; }
  button:disabled { opacity: .5; cursor: wait; }
  #message { width: 100%; margin: 0; min-height: 1.4em; }
  .erreur { color: var(--echec); }
  .travail { background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 16px; margin-top: 16px; }
  .entete { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
  .nom { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--doux); font-size: 13px; }
  .plaques { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
  figure { margin: 0; }
  figure img { width: 100%; background: #fff; border: 1px solid var(--trait); border-radius: 4px; }
  figcaption { font-size: 13px; text-align: center; color: var(--doux); }
</style>
</head>
<body>
<header class="entete"><h1>E-KO RIP Center</h1><button type="button" id="langue" class="discret"></button></header>
<main>
  <form id="envoi">
    <label><span data-t="mode"></span>
      <select name="mode"><option value="imprimer" data-t="imprimer"></option><option value="decouper" data-t="decouper"></option></select>
    </label>
    <label><span data-t="traces"></span>
      <select name="traces"><option value="tons" data-t="tons"></option><option value="tous" data-t="tous"></option></select>
    </label>
    <label><span data-t="reperage"></span>
      <select name="reperage"><option value="aucun" data-t="aucun"></option><option value="manuel" data-t="manuel"></option><option value="cadre" data-t="cadre"></option></select>
    </label>
    <label><span data-t="fichier"></span> <input type="file" name="fichier" accept="application/pdf,.pdf,.ai,image/svg+xml,.svg" required></label>
    <label><span data-t="resolution"></span>
      <select name="dpi"><option>360</option><option selected>720</option><option>1440</option></select>
    </label>
    <button type="submit" data-t="envoyer"></button>
    <p id="message" role="status"></p>
  </form>
  <section id="travaux" aria-live="polite"></section>
</main>
<script>
const textes = {
  fr: {
    fichier: "Fichier PDF, AI ou SVG", resolution: "Résolution", mode: "Mode", imprimer: "Imprimer (et découper)", decouper: "Découper seulement",
    traces: "Tracés à découper", tons: "Tons de découpe (CutContour…)", tous: "Tous les tracés", apercu_decoupe: "Découpe",
    supprimer: "Supprimer", relancer: "Relancer", confirmer: (n) => `Supprimer « ${n} » ?`,
    reperage: "Repérage Kona", aucun: "Aucun", manuel: "Croix P1–P4 (manuel)", cadre: "Cadre Mutoh (automatique, type 1)", envoyer: "Envoyer au RIP", autre: "English",
    envoi: "Envoi…", recu: (n) => `« ${n} » reçu.`, composite: "Composite", plaque: (p) => `Plaque ${p}`,
    en_attente: "En attente", en_cours: "Rendu en cours", termine: "Terminé", echec: "Échec",
    decoupe: (n) => n ? `Découpe : ${n} tracé${n > 1 ? "s" : ""}` : "Aucun tracé de découpe", telecharger: "Télécharger le fichier .plt", plotter: "Envoyer au plotter",
    etat_plotter: { en_attente: "Plotter : en attente", en_cours: "Plotter : envoi en cours", termine: "Plotter : envoyé", echec: "Plotter : échec" },
    erreurs: {
      format_inconnu: "Format non reconnu : envoyer un PDF, un AI ou un SVG.",
      ai_sans_pdf: "Fichier Illustrator sans compatibilité PDF : l'enregistrer avec « Créer un fichier compatible PDF ».",
      svg_decoupe_seulement: "Un SVG ne peut qu'être découpé : choisir « Découper seulement ».", mode_invalide: "Mode inconnu.", fichier_vide: "Le fichier est vide.",
      aucun_fichier: "Aucun fichier reçu.", dpi_invalide: "Résolution hors de 36 à 2880 dpi.",
      envoi_illisible: "Envoi illisible.", envoi_interrompu: "L'envoi a été interrompu.",
      erreur_interne: "Erreur du serveur.", introuvable: "Élément introuvable.",
      rendu_echoue: "Le rendu a échoué.", decoupe_illisible: "Tracés de découpe illisibles dans ce PDF.",
      rien_a_decouper: "Ce travail n'a aucun tracé de découpe.", travail_occupe: "Ce travail est en cours de rendu ou d'envoi.", envoi_en_cours: "Un envoi au plotter est déjà en cours.",
      envoi_decoupe_echoue: "L'envoi au plotter a échoué.", interrompu: "Rendu interrompu par un arrêt du serveur : renvoyer le fichier.",
      trop_gros: "Fichier trop volumineux pour le serveur.", reseau: "Serveur injoignable.",
    },
  },
  en: {
    fichier: "PDF, AI or SVG file", resolution: "Resolution", mode: "Mode", imprimer: "Print (and cut)", decouper: "Cut only",
    traces: "Paths to cut", tons: "Cut spot colours (CutContour…)", tous: "All paths", apercu_decoupe: "Cut",
    supprimer: "Delete", relancer: "Retry", confirmer: (n) => `Delete “${n}”?`,
    reperage: "Kona registration", aucun: "None", manuel: "P1–P4 crosses (manual)", cadre: "Mutoh frame (automatic, type 1)", envoyer: "Send to RIP", autre: "Français",
    envoi: "Sending…", recu: (n) => `“${n}” received.`, composite: "Composite", plaque: (p) => `${p} plate`,
    en_attente: "Queued", en_cours: "Rendering", termine: "Done", echec: "Failed",
    decoupe: (n) => n ? `Cutting: ${n} path${n > 1 ? "s" : ""}` : "No cut path", telecharger: "Download the .plt file", plotter: "Send to cutter",
    etat_plotter: { en_attente: "Cutter: queued", en_cours: "Cutter: sending", termine: "Cutter: sent", echec: "Cutter: failed" },
    erreurs: {
      format_inconnu: "Unknown format: send a PDF, AI or SVG file.",
      ai_sans_pdf: "Illustrator file without PDF compatibility: save it with “Create PDF Compatible File”.",
      svg_decoupe_seulement: "An SVG can only be cut: choose “Cut only”.", mode_invalide: "Unknown mode.", fichier_vide: "The file is empty.",
      aucun_fichier: "No file received.", dpi_invalide: "Resolution outside 36 to 2880 dpi.",
      envoi_illisible: "Unreadable upload.", envoi_interrompu: "The upload was interrupted.",
      erreur_interne: "Server error.", introuvable: "Not found.",
      rendu_echoue: "Rendering failed.", decoupe_illisible: "Unreadable cut paths in this PDF.",
      rien_a_decouper: "This job has no cut path.", travail_occupe: "This job is being rendered or sent.", envoi_en_cours: "A cutter job is already being sent.",
      envoi_decoupe_echoue: "Sending to the cutter failed.", interrompu: "Rendering stopped by a server shutdown: send the file again.",
      trop_gros: "File too large for the server.", reseau: "Server unreachable.",
    },
  },
};
let langue = (() => { try { return localStorage.getItem("langue"); } catch { return null; } })()
  || (navigator.language.startsWith("fr") ? "fr" : "en");
const T = () => textes[langue];
const form = document.getElementById("envoi"), msg = document.getElementById("message"), liste = document.getElementById("travaux");
const boutonLangue = document.getElementById("langue");

function appliquerLangue() {
  document.documentElement.lang = langue;
  document.querySelectorAll("[data-t]").forEach((n) => { n.textContent = T()[n.dataset.t]; });
  boutonLangue.textContent = T().autre;
  rafraichir();
}
boutonLangue.addEventListener("click", () => {
  langue = langue === "fr" ? "en" : "fr";
  try { localStorage.setItem("langue", langue); } catch {}
  msg.textContent = "";
  appliquerLangue();
});

/** Texte traduit d'une erreur : le code est traduit, le détail technique est ajouté tel quel. */
function texteErreur(code, detail) {
  const base = T().erreurs[code] || T().erreurs.erreur_interne;
  return detail ? `${base} (${detail})` : base;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const bouton = form.querySelector("button[type=submit]");
  bouton.disabled = true; msg.className = ""; msg.textContent = T().envoi;
  try {
    let r;
    try { r = await fetch("/api/travaux", { method: "POST", body: new FormData(form) }); }
    catch { throw new Error(texteErreur("reseau")); }
    const corps = await r.json().catch(() => ({}));
    if (r.status === 413) throw new Error(texteErreur("trop_gros"));
    if (!r.ok) throw new Error(texteErreur(corps.code, corps.detail));
    msg.textContent = T().recu(corps.nom); form.reset(); rafraichir();
  } catch (err) {
    msg.className = "erreur"; msg.textContent = err.message;
  } finally { bouton.disabled = false; }
});

function el(tag, attrs = {}, ...enfants) {
  const n = document.createElement(tag);
  Object.assign(n, attrs);
  n.append(...enfants);
  return n;
}

async function rafraichir() {
  let travaux;
  try { travaux = await (await fetch("/api/travaux")).json(); } catch { return; }
  liste.replaceChildren(...travaux.map((t) => {
    const date = new Date(t.cree_le * 1000).toLocaleString(langue === "fr" ? "fr-FR" : "en-GB");
    const carte = el("article", { className: "travail" },
      el("div", { className: "entete" },
        el("span", { className: "nom" }, t.nom),
        el("span", { className: "meta" }, [T()[t.statut], t.mode === "decouper" ? T().decouper : `${t.dpi} dpi`, date].join(" · "))));
    if (t.statut === "echec") carte.append(el("p", { className: "erreur" }, texteErreur(t.code_erreur || "rendu_echoue", t.erreur)));
    const actions = el("p", { className: "meta" });
    if (t.statut === "echec") actions.append(bouton(T().relancer, () => agir(`/api/travaux/${t.id}/relancer`, "POST")), " ");
    if (t.statut === "termine" || t.statut === "echec") actions.append(bouton(T().supprimer, () => confirm(T().confirmer(t.nom)) && agir(`/api/travaux/${t.id}`, "DELETE")));
    if (actions.childNodes.length) carte.append(actions);
    if (t.statut === "termine") {
      const vignettes = t.mode === "decouper" ? [] : [
        el("figure", {}, el("img", { src: `/api/travaux/${t.id}/apercu.png`, alt: T().composite }), el("figcaption", {}, T().composite))];
      if (t.traces_decoupe) vignettes.push(el("figure", {}, el("img", { src: `/api/travaux/${t.id}/decoupe.svg`, alt: T().apercu_decoupe }), el("figcaption", {}, T().apercu_decoupe)));
      const grille = el("div", { className: "plaques" }, ...vignettes,
        ...t.plaques.map((p) => el("figure", {},
          el("img", { src: `/api/travaux/${t.id}/plaques/${encodeURIComponent(p)}`, alt: T().plaque(p) }),
          el("figcaption", {}, p))));
      const ligne = el("p", { className: "meta" }, T().decoupe(t.traces_decoupe));
      if (t.traces_decoupe) {
        const envoi = t.envoi_decoupe;
        const occupe = envoi && (envoi.statut === "en_attente" || envoi.statut === "en_cours");
        const bouton = el("button", { type: "button", className: "discret", disabled: occupe }, T().plotter);
        bouton.addEventListener("click", () => decouper(t.id, bouton));
        ligne.append(" · ", el("a", { href: `/api/travaux/${t.id}/decoupe.plt`, download: "decoupe.plt" }, T().telecharger), " · ", bouton);
        if (envoi) ligne.append(" · ", el("span", { className: envoi.statut === "echec" ? "erreur" : "" },
          envoi.statut === "echec" ? `${T().etat_plotter.echec} — ${texteErreur(envoi.code_erreur, envoi.erreur)}` : T().etat_plotter[envoi.statut]));
      }
      carte.append(ligne, grille);
    }
    return carte;
  }));
}
function bouton(texte, action) {
  const b = el("button", { type: "button", className: "discret" }, texte);
  b.addEventListener("click", action);
  return b;
}

async function agir(url, methode) {
  try {
    const r = await fetch(url, { method: methode });
    if (!r.ok) { const c = await r.json().catch(() => ({})); msg.className = "erreur"; msg.textContent = texteErreur(c.code, c.detail); }
  } catch { msg.className = "erreur"; msg.textContent = texteErreur("reseau"); }
  rafraichir();
}

async function decouper(id, bouton) {
  bouton.disabled = true;
  try {
    const r = await fetch(`/api/travaux/${id}/decouper`, { method: "POST" });
    if (!r.ok) { const c = await r.json().catch(() => ({})); msg.className = "erreur"; msg.textContent = texteErreur(c.code, c.detail); }
  } catch { msg.className = "erreur"; msg.textContent = texteErreur("reseau"); }
  rafraichir();
}

appliquerLangue();
setInterval(rafraichir, 3000);
</script>
</body>
</html>
