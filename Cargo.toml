[package]
name = "eko-rip"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
image = { version = "0.25.10", default-features = false, features = ["tiff", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
