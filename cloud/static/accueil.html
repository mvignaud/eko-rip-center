<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-KO RIP Cloud</title>
<style>
  :root { color-scheme: light dark; --fond: #f5f5f7; --texte: #1d1d1f; --doux: #6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --fond: #1c1c1e; --texte: #f5f5f7; --doux: #a1a1a6; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fond); color: var(--texte); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 32rem; padding: 2rem 1rem; text-align: center; }
  h1 { font-size: 1.8rem; margin: 0 0 .5rem; }
  p { color: var(--doux); }
</style>
</head>
<body>
<main>
  <h1>E-KO RIP Cloud</h1>
  <p>Accès à distance aux serveurs E-KO RIP Center des ateliers, sans VPN ni port ouvert.</p>
  <p>Le portail (comptes, sites, droits) arrive bientôt. Version {version}.</p>
</main>
</body>
</html>
