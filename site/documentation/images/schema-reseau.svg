<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, 'Segoe UI', Ubuntu, Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Ports réseau du serveur RIP</title>
  <desc id="d">Les clients joignent le serveur sur le port TCP 8640 et le trouvent par mDNS (UDP 5353). Le serveur joint les imprimantes sur les ports 9100, 631 et SNMP 161, les découpeuses en USB ou en réseau, et sort en HTTPS (443) vers le Cloud, l'ERP et le dépôt APT. Le port 8640 ne doit jamais être ouvert sur Internet.</desc>
  <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a505c"/></marker></defs>
  <rect width="960" height="400" rx="22" fill="#f6f7f9"/>
  <rect x="380" y="130" width="200" height="140" rx="16" fill="#0a84ff"/>
  <text x="480" y="186" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Serveur RIP</text>
  <text x="480" y="210" font-size="13" fill="#e6f1ff" text-anchor="middle">adresse IP fixe</text>
  <text x="480" y="232" font-size="13" fill="#e6f1ff" text-anchor="middle">ex. 192.168.1.20</text>
  <g font-size="14" fill="#14161a">
    <rect x="30" y="60" width="230" height="70" rx="12" fill="#fff" stroke="#d6dae2"/><text x="48" y="90" font-weight="700">Clients Mac, Linux, Windows</text><text x="48" y="112" font-size="12" fill="#4a505c">TCP 8640 · découverte mDNS UDP 5353</text>
    <rect x="30" y="165" width="230" height="70" rx="12" fill="#fff" stroke="#d6dae2"/><text x="48" y="195" font-weight="700">Postes en dépôt de fichiers</text><text x="48" y="217" font-size="12" fill="#4a505c">Samba TCP 445 (si partagé)</text>
    <rect x="30" y="270" width="230" height="70" rx="12" fill="#fff" stroke="#d6dae2"/><text x="48" y="300" font-weight="700">Application mobile (Wi-Fi)</text><text x="48" y="322" font-size="12" fill="#4a505c">TCP 8640</text>
    <rect x="700" y="40" width="230" height="70" rx="12" fill="#fff" stroke="#d6dae2"/><text x="718" y="70" font-weight="700">Imprimantes</text><text x="718" y="92" font-size="12" fill="#4a505c">9100 · IPP 631 · SNMP UDP 161</text>
    <rect x="700" y="130" width="230" height="70" rx="12" fill="#fff" stroke="#d6dae2"/><text x="718" y="160" font-weight="700">Découpeuses</text><text x="718" y="182" font-size="12" fill="#4a505c">USB (série) ou réseau</text>
    <rect x="700" y="220" width="230" height="70" rx="12" fill="#fff" stroke="#d6dae2"/><text x="718" y="250" font-weight="700">Internet (sortant seul)</text><text x="718" y="272" font-size="12" fill="#4a505c">HTTPS 443 : Cloud, ERP, mises à jour</text>
  </g>
  <g stroke="#4a505c" stroke-width="2" fill="none" marker-end="url(#f)">
    <path d="M260 95 C320 95 330 160 378 168"/>
    <path d="M260 200 L378 200"/>
    <path d="M260 305 C320 305 330 240 378 232"/>
    <path d="M580 165 C640 160 640 75 698 75"/>
    <path d="M580 190 C640 190 650 165 698 165"/>
    <path d="M580 240 C640 245 650 255 698 255"/>
  </g>
  <rect x="300" y="312" width="360" height="56" rx="12" fill="#fff0f7" stroke="#ec008c"/>
  <text x="480" y="337" font-size="13" font-weight="700" fill="#b0006a" text-anchor="middle">Ne jamais ouvrir le port 8640 sur Internet.</text>
  <text x="480" y="356" font-size="12" fill="#b0006a" text-anchor="middle">Pour l'accès à distance : le Cloud E-KO RIP.</text>
</svg>
