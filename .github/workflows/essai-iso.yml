name: Essai de l'image d'installation

# L'image Ubuntu démarre-t-elle sur nos profils ? Construite avec de faux paquets (ils ne
# servent qu'après les questions), démarrée en machine virtuelle (KVM) sur le premier
# profil, console série : l'installateur doit avoir lu et accepté notre profil et poser
# « Continue with autoinstall? » ou l'écran du profil (nom, mot de passe). Un profil
# refusé (YAML ou schéma) échoue avant. « installation » va jusqu'au bout : profil
# serveur seul, vrai paquet, puis démarrage sur le disque installé.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["image/**", ".github/workflows/essai-iso.yml"]

jobs:
  artcraft:
    # La suite ArtCraft s'installe-t-elle sur Ubuntu 24.04 (le runner) comme sur le PC ?
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update
      - name: Installation réelle de toute la suite
        run: sudo image/eko-artcraft
      - name: Applications installées
        run: |
          for a in photocraft vectorcraft filmcraft lightcraft pdfcraft effectcraft designcraft figcraft wordcraft soundcraft deckcraft cadcraft gridcraft; do
            dpkg -s "$a" > /dev/null 2>&1 && echo "$a : $(dpkg-query -W -f='${Version}' "$a")" || { echo "$a : ABSENT"; exit 1; }
          done
          ls /usr/share/applications | grep -i craft

  demarrage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y xorriso qemu-system-x86 qemu-utils
      - name: KVM pour la machine virtuelle
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: ISO Ubuntu 24.04 LTS Server officielle, empreinte vérifiée
        run: |
          BASE=https://releases.ubuntu.com/24.04
          curl -fsSL "$BASE/SHA256SUMS" | grep -E '\*?ubuntu-24\.04(\.[0-9]+)?-live-server-amd64\.iso$' | sort -V -k2 | tail -1 > SHA256SUMS
          ISO=$(awk '{print $2}' SHA256SUMS | tr -d '*')
          curl -fsSL -o "$ISO" "$BASE/$ISO"
          sha256sum -c SHA256SUMS
          echo "UBUNTU=$ISO" >> "$GITHUB_ENV"
      - name: Image avec console série
        run: |
          echo faux > serveur.deb && echo faux > client.deb
          EKO_OPTIONS_NOYAU="console=ttyS0,115200" image/construire-iso.sh "$UBUNTU" serveur.deb client.deb essai.iso
          rm -f "$UBUNTU"
      - name: Démarrage jusqu'à la question de l'installateur
        run: |
          qemu-img create -f qcow2 disque.qcow2 25G
          # Console série sur une socket : l'installateur y pose d'abord l'écran « Serial »
          # (choix du mode d'affichage), auquel on répond Entrée.
          qemu-system-x86_64 -enable-kvm -cpu host -m 4096 -smp 2 \
            -drive file=disque.qcow2,if=virtio -cdrom essai.iso -boot d \
            -display none -serial tcp:127.0.0.1:4555,server,nowait -monitor none &
          sleep 3
          python3 - <<'PY'
          import re, socket, sys, time
          s = socket.create_connection(("127.0.0.1", 4555))
          s.settimeout(5)
          journal, vu, fin = b"", 0, time.time() + 900
          entree_faite = False
          while time.time() < fin:
              try:
                  bloc = s.recv(65536)
              except socket.timeout:
                  bloc = b""
              journal += bloc
              texte = re.sub(rb"\x1b\[[0-9;?]*[A-Za-z]", b"", journal).decode("utf-8", "replace")
              if not entree_faite and "Serial" in texte and "Help" in texte:
                  time.sleep(2); s.sendall(b"\r"); entree_faite = True; print("écran Serial : Entrée envoyée", flush=True)
              for preuve in ("Continue with autoinstall", "Profile configuration", "Profile setup", "Your name"):
                  if preuve in texte:
                      print(f"atteint : « {preuve} » après {int(900 - (fin - time.time()))} s")
                      open("serie.log", "wb").write(journal)
                      sys.exit(0)
              if "validation error" in texte or "did not validate" in texte or "Traceback" in texte:
                  break
          open("serie.log", "wb").write(journal)
          print(re.sub(r"\s+\n", "\n", texte[-5000:]))
          sys.exit(1)
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: console-serie, path: serie.log, retention-days: 7 }

  installation:
    # Installation complète, sans question, du profil « serveur seul » avec le vrai paquet
    # du commit, puis démarrage sur le disque : le service doit répondre sur le port 8640.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - name: Paquet du serveur
        run: cargo deb -p eko-rip-serveur --locked --output dist/ && ls dist/
      - run: sudo apt-get update && sudo apt-get install -y xorriso qemu-system-x86 qemu-utils
      - name: KVM pour la machine virtuelle
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: ISO Ubuntu 24.04 LTS Server officielle, empreinte vérifiée
        run: |
          BASE=https://releases.ubuntu.com/24.04
          curl -fsSL "$BASE/SHA256SUMS" | grep -E '\*?ubuntu-24\.04(\.[0-9]+)?-live-server-amd64\.iso$' | sort -V -k2 | tail -1 > SHA256SUMS
          ISO=$(awk '{print $2}' SHA256SUMS | tr -d '*')
          curl -fsSL -o "$ISO" "$BASE/$ISO"
          sha256sum -c SHA256SUMS
          echo "UBUNTU=$ISO" >> "$GITHUB_ENV"
      - name: Image d'essai (compte fixé, profil serveur seul, sans confirmation)
        run: |
          # Mot de passe aléatoire jamais affiché : le compte ne sert qu'à passer l'écran.
          EMPREINTE=$(openssl passwd -6 "$(openssl rand -hex 16)")
          echo faux > client.deb
          EKO_ESSAI_IDENTITE="essai $EMPREINTE" EKO_ENTREE_DEFAUT=2 EKO_OPTIONS_NOYAU="console=ttyS0,115200 autoinstall" \
            image/construire-iso.sh "$UBUNTU" dist/eko-rip-serveur_*_amd64.deb client.deb essai.iso
          rm -f "$UBUNTU"
      - name: Installation (la machine s'arrête au redémarrage final)
        run: |
          qemu-img create -f qcow2 disque.qcow2 25G
          qemu-system-x86_64 -enable-kvm -cpu host -m 4096 -smp 2 -no-reboot \
            -drive file=disque.qcow2,if=virtio -cdrom essai.iso -boot d -nic user \
            -display none -serial tcp:127.0.0.1:4555,server,nowait -monitor none &
          echo "QEMU=$!" >> "$GITHUB_ENV"
          sleep 3
          python3 - <<'PY'
          import re, socket, sys, time
          s = socket.create_connection(("127.0.0.1", 4555))
          s.settimeout(5)
          journal, fin, serie, retrait, arrete = b"", time.time() + 4500, False, False, False
          while time.time() < fin:
              try:
                  bloc = s.recv(65536)
                  if not bloc:
                      arrete = True  # QEMU arrêté : -no-reboot au redémarrage de fin d'installation
                      break
              except socket.timeout:
                  bloc = b""
              journal += bloc
              texte = re.sub(rb"\x1b\[[0-9;?]*[A-Za-z]", b"", journal[-200000:]).decode("utf-8", "replace")
              if not serie and "Serial" in texte and "Help" in texte:
                  time.sleep(2); s.sendall(b"\r"); serie = True; print("écran Serial : Entrée", flush=True)
              if not retrait and "remove the installation medium" in texte:
                  s.sendall(b"\r"); retrait = True; print("support retiré : Entrée", flush=True)
              if "validation error" in texte or "did not validate" in texte or "An error occurred" in texte:
                  print("échec de l'installation", flush=True); break
          open("installation.log", "wb").write(journal)
          texte = re.sub(rb"\x1b\[[0-9;?]*[A-Za-z]", b"", journal).decode("utf-8", "replace")
          print(re.sub(r"\s+\n", "\n", texte[-4000:]))
          sys.exit(0 if arrete else 1)
          PY
          ! kill -0 "$QEMU" 2>/dev/null
      - name: Démarrage sur le disque, service sur le port 8640
        run: |
          qemu-system-x86_64 -enable-kvm -cpu host -m 2048 -smp 2 \
            -drive file=disque.qcow2,if=virtio -nic user,hostfwd=tcp:127.0.0.1:8640-:8640 \
            -display none -serial file:demarrage.log -monitor none &
          for i in $(seq 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8640/ -o accueil.html; then break; fi
            sleep 5
          done
          grep -q "E-KO RIP Center" accueil.html
          echo "page d'état servie au navigateur :"; grep -o "<title>[^<]*" accueil.html
          curl -fsS -A "EKO-RIP-Client/1" http://127.0.0.1:8640/api/session | tee session.json
          grep -q '"acces_libre":true' session.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8640/api/travaux)" = 403
          echo "API réservée au client : 403 pour un navigateur"
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: installation-complete, path: "*.log", retention-days: 7 }
