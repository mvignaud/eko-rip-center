name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: La version du tag correspond à Cargo.toml
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME ≠ version $VERSION"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md n'a pas de section $VERSION"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ghostscript
      - run: cargo test -p eko-rip-serveur --locked

  serveur:
    needs: tests
    runs-on: ubuntu-22.04 # glibc ancienne : le binaire tourne aussi sur Debian 12/13 et Ubuntu 22.04+
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - name: Paquet Debian
        run: cargo deb -p eko-rip-serveur --locked --output dist/
      - name: Archive du binaire
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p "pack/eko-rip-serveur-$VERSION"
          cp target/release/eko-rip-serveur README.md CHANGELOG.md "pack/eko-rip-serveur-$VERSION/"
          tar -C pack -czf "dist/eko-rip-serveur-$VERSION-linux-x86_64.tar.gz" "eko-rip-serveur-$VERSION"
      - uses: actions/upload-artifact@v7
        with: { name: serveur, path: dist/* }

  client-iso:
    # Client .deb pour l'ISO Ubuntu 24.04 (bibliothèques « t64 » : le paquet bâti sur 22.04
    # ne s'y installerait pas).
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Paquet .deb du client
        working-directory: client
        run: npx --yes @tauri-apps/cli@2 build --bundles deb
      - run: mkdir dist && find target -path '*/release/bundle/deb/*.deb' -exec cp {} dist/eko-rip-client-ubuntu24.deb \; && ls -la dist
      - uses: actions/upload-artifact@v7
        with: { name: paquet-client-iso, path: dist/* }

  iso:
    # Après la release : l'image (4 Go) est déposée directement sur la release, sans passer
    # par un artefact de 4 Go entre jobs (son téléchargement a échoué deux fois, v0.12.0).
    # En cas d'échec, relancer ce seul job : --clobber réécrit les morceaux.
    needs: [serveur, client-iso, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: serveur, path: serveur-dist }
      - uses: actions/download-artifact@v8
        with: { name: paquet-client-iso, path: client-dist }
      - run: sudo apt-get update && sudo apt-get install -y xorriso
      - name: ISO Ubuntu 24.04 LTS Server officielle (dernière révision), empreinte vérifiée
        run: |
          BASE=https://releases.ubuntu.com/24.04
          curl -fsSL "$BASE/SHA256SUMS" | grep -E '\*?ubuntu-24\.04(\.[0-9]+)?-live-server-amd64\.iso$' | sort -V -k2 | tail -1 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" = 1
          ISO=$(awk '{print $2}' SHA256SUMS | tr -d '*')
          curl -fsSL -o "$ISO" "$BASE/$ISO"
          sha256sum -c SHA256SUMS
          echo "UBUNTU=$ISO" >> "$GITHUB_ENV"
      - name: Image d'installation (trois profils)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          NOM="eko-rip-center-$VERSION-ubuntu-24.04-amd64.iso"
          image/construire-iso.sh "$UBUNTU" serveur-dist/eko-rip-serveur_*_amd64.deb client-dist/eko-rip-client-ubuntu24.deb "$NOM"
          rm -f "$UBUNTU"
          # Une release GitHub refuse les fichiers de plus de 2 Go : l'image part en morceaux
          # de 1,9 Go, avec l'empreinte de l'image entière.
          mkdir iso-dist
          sha256sum "$NOM" > "iso-dist/$NOM.sha256"
          split -b 1900m -d -a 1 "$NOM" "iso-dist/$NOM.part"
          rm -f "$NOM"
          ls -la iso-dist
      - name: Dépôt sur la release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "$GITHUB_REF_NAME" iso-dist/* --clobber

  image:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=E-KO RIP Center (serveur)
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  client:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            cibles: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            cibles: ""
          - os: ubuntu-22.04
            args: ""
            cibles: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.cibles }}" }
      - uses: Swatinem/rust-cache@v2
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Construction du client
        working-directory: client
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
      - name: Paquets produits
        shell: bash
        run: |
          mkdir dist
          find target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist)"
      - uses: actions/upload-artifact@v7
        with: { name: "client-${{ matrix.os }}", path: dist/* }

  release:
    needs: [serveur, image, client]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        # Seulement nos paquets : build-push-action dépose aussi un artefact *.dockerbuild.
        with: { path: dist, merge-multiple: true, pattern: "{serveur,client-*}" }
      - name: Notes tirées du changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {garder=1; next} /^## \[/ {garder=0} garder' CHANGELOG.md > notes.md
          printf '\n## Installation\n\n- Serveur : [docs/fr/installation-serveur.md](docs/fr/installation-serveur.md) · image `ghcr.io/%s:%s`\n- PC dédié (Ubuntu 24.04, ⚠️ efface le disque) : réunir tous les morceaux `eko-rip-center-%s-ubuntu-24.04-amd64.iso.part*` dans l’ordre (Linux/macOS : `cat *.iso.part* > eko-rip-center-%s-ubuntu-24.04-amd64.iso` ; Windows : `copy /b fichier.part0 + fichier.part1 + fichier.part2 fichier.iso`), vérifier avec le fichier `.sha256`, puis copier sur une clé USB\n- Client : [docs/fr/installation-client.md](docs/fr/installation-client.md)\n' "$GITHUB_REPOSITORY" "$VERSION" "$VERSION" "$VERSION" >> notes.md
          cat notes.md
      - name: Publication
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "E-KO RIP Center $GITHUB_REF_NAME" --notes-file notes.md
