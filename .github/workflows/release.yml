name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: La version du tag correspond à Cargo.toml
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME ≠ version $VERSION"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md n'a pas de section $VERSION"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ghostscript
      - run: cargo test -p eko-rip-serveur --locked

  serveur:
    needs: tests
    runs-on: ubuntu-22.04 # glibc ancienne : le binaire tourne aussi sur Debian 12/13 et Ubuntu 22.04+
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - name: Paquet Debian
        run: cargo deb -p eko-rip-serveur --locked --output dist/
      - name: Archive du binaire
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p "pack/eko-rip-serveur-$VERSION"
          cp target/release/eko-rip-serveur README.md CHANGELOG.md "pack/eko-rip-serveur-$VERSION/"
          tar -C pack -czf "dist/eko-rip-serveur-$VERSION-linux-x86_64.tar.gz" "eko-rip-serveur-$VERSION"
      - uses: actions/upload-artifact@v7
        with: { name: serveur, path: dist/* }

  iso:
    needs: serveur
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: serveur, path: serveur-dist }
      - run: sudo apt-get update && sudo apt-get install -y xorriso
      - name: ISO netinst Debian officielle, empreinte vérifiée
        run: |
          BASE=https://cdimage.debian.org/debian-cd/current/amd64/iso-cd
          curl -fsSL "$BASE/SHA256SUMS" | grep -E ' debian-[0-9.]+-amd64-netinst\.iso$' > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" = 1
          ISO=$(awk '{print $2}' SHA256SUMS)
          curl -fsSL -o "$ISO" "$BASE/$ISO"
          sha256sum -c SHA256SUMS
          echo "NETINST=$ISO" >> "$GITHUB_ENV"
      - name: Image d'installation du serveur
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir iso-dist
          image/construire-iso.sh "$NETINST" serveur-dist/eko-rip-serveur_*_amd64.deb "iso-dist/eko-rip-center-serveur-$VERSION-amd64.iso"
      - uses: actions/upload-artifact@v7
        with: { name: iso, path: iso-dist/*, compression-level: 0 }

  image:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=E-KO RIP Center (serveur)
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  client:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            cibles: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            cibles: ""
          - os: ubuntu-22.04
            args: ""
            cibles: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.cibles }}" }
      - uses: Swatinem/rust-cache@v2
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Construction du client
        working-directory: client
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
      - name: Paquets produits
        shell: bash
        run: |
          mkdir dist
          find target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist)"
      - uses: actions/upload-artifact@v7
        with: { name: "client-${{ matrix.os }}", path: dist/* }

  release:
    needs: [serveur, iso, image, client]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        # Seulement nos paquets : build-push-action dépose aussi un artefact *.dockerbuild.
        with: { path: dist, merge-multiple: true, pattern: "{serveur,iso,client-*}" }
      - name: Notes tirées du changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {garder=1; next} /^## \[/ {garder=0} garder' CHANGELOG.md > notes.md
          printf '\n## Installation\n\n- Serveur : [docs/fr/installation-serveur.md](docs/fr/installation-serveur.md) · image `ghcr.io/%s:%s`\n- Serveur sur un PC dédié : `eko-rip-center-serveur-%s-amd64.iso` (⚠️ efface le disque)\n- Client : [docs/fr/installation-client.md](docs/fr/installation-client.md)\n' "$GITHUB_REPOSITORY" "$VERSION" "$VERSION" >> notes.md
          cat notes.md
      - name: Publication
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "E-KO RIP Center $GITHUB_REF_NAME" --notes-file notes.md
