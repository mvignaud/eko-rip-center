name: CI

# Sur le serveur CI dédié (runner `eko-ci-rip`, voir .github/runner/installer-runner.sh)
# depuis le 2026-11-03 : plus de minutes GitHub Actions.
#
# Dépôt PUBLIC, runner auto-hébergé : une PR venue d'un fork ne tourne JAMAIS ici
# (condition `if` de chaque job). Seuls `main`, les PR ouvertes depuis ce dépôt et le
# lancement à la main passent.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive

# Les conteneurs lancent les étapes avec sh par défaut : set -o pipefail, ${!x}
# et <<< demandent bash.
defaults:
  run:
    shell: bash

jobs:
  serveur:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, eko-ci-rip]
    container: ubuntu:24.04
    steps:
      - name: Outillage
        run: |
          apt-get update -q
          apt-get install -yq --no-install-recommends ca-certificates curl git build-essential pkg-config \
              ghostscript nodejs python3
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rip-serveur-${{ hashFiles('Cargo.lock') }}
          restore-keys: rip-serveur-
      # Les mêmes contrôles qu'en local : syntaxe des pages, doc générée à jour,
      # traductions en double, clippy, tests (serveur + cloud).
      - run: outils/verifier.sh

  client-linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, eko-ci-rip]
    container: ubuntu:26.04 # libadwaita 1.4+ et webkitgtk 6, comme les postes
    steps:
      - name: Outillage
        run: |
          apt-get update -q
          apt-get install -yq --no-install-recommends ca-certificates curl git build-essential pkg-config \
              libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clients/linux/target
          key: rip-client-linux-${{ hashFiles('clients/linux/Cargo.lock') }}
          restore-keys: rip-client-linux-
      - working-directory: clients/linux
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
