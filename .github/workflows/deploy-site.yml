name: Publier le site

# Publie le site vitrine https://e-ko.rip et sa documentation (site/) depuis le serveur CI
# dédié (2026-11-03), sur ordre de Mathieu dans le chat (« Déploie le site »). Lancé par
# Claude via l'API GitHub (workflow_dispatch sur main). Même script qu'au Mac :
# outils/publier-site.sh, qui refuse une documentation générée en retard sur docs/.
#
# Prérequis : l'IP du serveur CI (15.235.86.71) déclarée dans cPanel → « Autorisation SSH ».
# Secrets de l'environnement `production` : O2SWITCH_SSH_KEY, O2SWITCH_KNOWN_HOSTS.
on:
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

# Les conteneurs lancent les étapes avec sh par défaut : set -o pipefail, ${!x}
# et <<< demandent bash.
defaults:
  run:
    shell: bash

jobs:
  site:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, eko-ci-rip]
    container: ubuntu:24.04
    environment: production
    env:
      DEBIAN_FRONTEND: noninteractive
      EKO_SITE_HOTE: sc3nihe1770@fleur.o2switch.net
    steps:
      - name: Outillage
        run: |
          apt-get update -q
          apt-get install -yq --no-install-recommends ca-certificates curl git rsync perl python3 openssh-client
      - uses: actions/checkout@v4
      - name: Clé SSH o2switch
        env:
          O2SWITCH_SSH_KEY: ${{ secrets.O2SWITCH_SSH_KEY }}
          O2SWITCH_KNOWN_HOSTS: ${{ secrets.O2SWITCH_KNOWN_HOSTS }}
        run: |
          [ -n "$O2SWITCH_SSH_KEY" ] && [ -n "$O2SWITCH_KNOWN_HOSTS" ] || { echo "::error::Secrets O2SWITCH_* absents de l'environnement production."; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$O2SWITCH_SSH_KEY" > ~/.ssh/o2switch && chmod 600 ~/.ssh/o2switch
          printf '%s\n' "$O2SWITCH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host fleur.o2switch.net\n  IdentityFile ~/.ssh/o2switch\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - run: outils/publier-site.sh
      - name: Vérification
        run: curl -fsSI https://e-ko.rip/ | head -1
      - name: Oublier la clé
        if: always()
        run: rm -rf ~/.ssh
